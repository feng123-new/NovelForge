name: Web bilingual maintenance
on:
  push:
    branches: [feat/web-i18n-rc2]
permissions:
  contents: write
concurrency:
  group: bilingual-maintenance
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/web-i18n-rc2
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: npm ci --prefix web
      - name: Apply reviewed locale migration
        run: |
          node web/prepare-i18n.mjs
          node web/localize.mjs
          node web/post-i18n.mjs
          python3 web/review-i18n.py
          python3 - <<'PY'
          from pathlib import Path
          p=Path('web/finish-i18n.mjs')
          p.write_text(p.read_text().replace(chr(36)+'{{ github.', '\\'+chr(36)+'{{ github.'))
          PY
          node web/finish-i18n.mjs
      - name: Build isolated review worktree
        run: |
          npm run build --prefix web
          mkdir -p /tmp/i18n-native
          CGO_ENABLED=0 go build -o /tmp/i18n-native/novelforge ./cmd/novelforge
      - name: Check types and focused bilingual invariants
        run: |
          npm run check:i18n --prefix web
          npm run check --prefix web -- --fail-on-warnings
          npm run test:i18n --prefix web
      - name: Affected page and wizard regression tests
        run: npm test --prefix web -- src/pages src/lib/wizard.test.ts
      - name: Real browser bilingual audit
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk >/dev/null
          node scripts/i18n-browser.mjs /tmp/i18n-native/novelforge
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bilingual-evidence
          path: verification-results/i18n
          if-no-files-found: ignore
      - name: Prepare clean candidate content after all gates pass
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import shutil,re
          for language in ['zh-CN','en']:
            shutil.copyfile(f'verification-results/i18n/dashboard-{language}.png', f'docs/assets/ui/dashboard-{language}.png')
          p=Path('README.md')
          section='''## Web 工作台实机预览

          下图为本次中英双语审计中，真实嵌入式 Go 服务与 Chrome 的截图，不是设计稿。审计使用独立测试项目，不配置或调用付费模型。

          ### 简体中文

          ![中文工作台](docs/assets/ui/dashboard-zh-CN.png)

          ### English

          ![English workspace](docs/assets/ui/dashboard-en.png)

          全部 14 个页面的 28 个语言视图和编辑状态保留检查见 [本次预发布说明](docs/releases/v0.1.0-rc.2.md)。这不是长篇规模或真实模型文学质量验收。

          ## NovelForge 解决什么问题'''
          p.write_text(re.sub(r'## Web 工作台实机预览[\s\S]*?## NovelForge 解决什么问题',section,p.read_text()))
          PY
          node web/finish-i18n.mjs finalize
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/package_candidate.py')
          compile(p.read_text(),str(p),'exec')
          PY
          mkdir -p /tmp/reviewed-workflows
          cp .github/workflows/candidate.yml .github/workflows/i18n.yml /tmp/reviewed-workflows/
          # The Actions token commits application content only. Workflow changes
          # are separately applied through the authorized repository connection.
          git restore --source=HEAD -- .github/workflows/candidate.yml .github/workflows/i18n-maintenance.yml
          rm .github/workflows/i18n.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- README.md README.en.md web docs scripts
          git diff --cached --stat
          git commit -m 'feat: ship verified bilingual Web content and rc.2 documentation'
          git push origin HEAD:feat/web-i18n-rc2
      - uses: actions/upload-artifact@v4
        with:
          name: reviewed-workflows
          path: /tmp/reviewed-workflows
