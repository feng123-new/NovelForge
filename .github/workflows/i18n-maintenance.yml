name: Web bilingual maintenance
on:
  push:
    branches: [feat/web-i18n-rc2]
permissions:
  contents: write
concurrency:
  group: bilingual-maintenance
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/web-i18n-rc2
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: npm ci --prefix web
      - name: Apply reviewed locale migration
        run: |
          node web/prepare-i18n.mjs
          node web/localize.mjs
          node web/post-i18n.mjs
      - name: Check types and focused bilingual invariants
        run: |
          npm run check --prefix web -- --fail-on-warnings
          npm run test:i18n --prefix web
      - name: Affected page and wizard regression tests
        run: |
          set +e
          cd web
          npm test -- src/pages src/lib/wizard.test.ts --reporter=json --outputFile=/tmp/ui-tests.json >/tmp/ui-tests.log 2>&1
          status=$?
          python3 - <<'PY'
          import json
          p=json.load(open('/tmp/ui-tests.json'))
          print('AFFECTED_UI_RESULTS', p['numPassedTests'], 'passed;',p['numFailedTests'],'failed')
          for suite in p['testResults']:
            for test in suite['assertionResults']:
              if test['status']=='failed':
                print('FAILED',suite['name'],test['fullName'])
                for message in test['failureMessages']: print(message.split('Ignored nodes:')[0][:2500])
          PY
          exit $status
      - name: Build embedded production assets
        run: |
          npm run build --prefix web
          CGO_ENABLED=0 go build -o /tmp/novelforge ./cmd/novelforge
      - name: Real browser bilingual audit
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk >/dev/null
          node scripts/i18n-browser.mjs /tmp/novelforge
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bilingual-evidence
          path: |
            verification-results/i18n
            /tmp/ui-tests.json
            /tmp/ui-tests.log
          if-no-files-found: ignore
      - name: Record reviewed source and generated assets on this branch only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web docs scripts
          if ! git diff --cached --quiet; then
            git commit -m 'feat: materialize and verify complete bilingual workspace'
            git push origin HEAD:feat/web-i18n-rc2
          fi
