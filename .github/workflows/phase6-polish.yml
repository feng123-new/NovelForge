name: Temporary Phase 6 polish and revalidation

on:
  push:
    branches:
      - ops/phase6-polish

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/phase-06-narrative-ledger
          fetch-depth: 0
      - name: Apply cross-platform and verification polish
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          route_source = '\n'.join(p.read_text() for p in Path('internal/server').glob('*.go') if p.name != 'narrative_ledger.go')
          match = re.search(r'func\s+\(\s*[A-Za-z_]\w*\s+\*([A-Za-z_]\w*)\s*\)\s*handle[A-Za-z0-9_]*Finalize', route_source)
          if not match:
              match = re.search(r'func\s+\(\s*[A-Za-z_]\w*\s+\*([A-Za-z_]\w*)\s*\).*?finalize', route_source, re.I|re.S)
          if not match:
              raise SystemExit('cannot resolve concrete server receiver type')
          server_type = match.group(1)
          path = Path('internal/server/narrative_ledger.go')
          text = path.read_text()
          text = re.sub(r'func \(s \*[A-Za-z_]\w*\)', f'func (s *{server_type})', text)
          text = text.replace('type narrativeResponseBuffer struct { header http.Header; body bytes.Buffer; status int }', 'type narrativeResponseBuffer struct { header http.Header; body bytes.Buffer; status int; wroteHeader bool }')
          text = text.replace('func (b *narrativeResponseBuffer) WriteHeader(status int) { if b.body.Len() == 0 && b.status == http.StatusOK { b.status = status } }', 'func (b *narrativeResponseBuffer) WriteHeader(status int) { if b.wroteHeader { return }; b.status = status; b.wroteHeader = true }')
          text = text.replace('func (b *narrativeResponseBuffer) Write(value []byte) (int, error) { return b.body.Write(value) }', 'func (b *narrativeResponseBuffer) Write(value []byte) (int, error) { if !b.wroteHeader { b.WriteHeader(http.StatusOK) }; return b.body.Write(value) }')
          path.write_text(text)

          test = Path('internal/server/narrative_ledger_test.go')
          text = test.read_text()
          text = re.sub(r'func narrativeTestServer\(t \*testing.T\) \(\*[A-Za-z_]\w*, func\(\)\)', f'func narrativeTestServer(t *testing.T) (*{server_type}, func())', text)
          text = re.sub(r'return &[A-Za-z_]\w*\{\}, setNarrativeRepositoryForTest', f'return &{server_type}{{}}, setNarrativeRepositoryForTest', text)
          test.write_text(text)

          repo = Path('internal/narrativeledger/repository.go')
          text = repo.read_text().replace('\n\t"bytes"', '').replace('\nvar _ = bytes.MinRead\n', '\n')
          repo.write_text(text)

          component = Path('web/src/components/NarrativeLedgerPanel.svelte')
          text = component.read_text()
          text = text.replace("const values = <T>(record: Record<string,T> | undefined): T[] => Object.values(record ?? {});\n    const open = <T extends {status:string}>(record: Record<string,T> | undefined): T[] => values(record).filter((value) => value.status === 'open');", "function values<T>(record: Record<string, T> | undefined): T[] { return Object.values(record ?? {}); }\n    function open<T extends {status: string}>(record: Record<string, T> | undefined): T[] { return values(record).filter((value) => value.status === 'open'); }")
          component.write_text(text)

          client_test = Path('web/src/lib/narrativeLedger.test.ts')
          text = client_test.read_text().replace(" satisfies Partial<NarrativeLedgerAPIError>", "")
          client_test.write_text(text)

          ci = Path('.github/workflows/ci.yml')
          text = ci.read_text()
          if 'workflow_dispatch:' not in text:
              if '\non:\n' in text:
                  text = text.replace('\non:\n', '\non:\n  workflow_dispatch:\n', 1)
              elif text.startswith('on:\n'):
                  text = text.replace('on:\n', 'on:\n  workflow_dispatch:\n', 1)
              else:
                  raise SystemExit('CI trigger block not found')
              ci.write_text(text)
          PY
          gofmt -w internal/narrativeledger/*.go internal/server/narrative_ledger*.go
          python3 -m json.tool internal/server/openapi_phase5.json >/dev/null
      - name: Revalidate backend
        shell: bash
        run: |
          set -euo pipefail
          GOWORK=off go vet ./...
          GOWORK=off go test -buildvcs=false -count=1 ./...
          CGO_ENABLED=0 GOWORK=off go build -buildvcs=false ./...
      - name: Revalidate frontend
        shell: bash
        working-directory: web
        run: |
          set -euo pipefail
          npm ci
          npm run check
          npm test -- --run
          npm run build
      - name: Commit polished feature head
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .
          if ! git diff --cached --quiet; then git commit -m 'test: harden Phase 6 cross-platform validation'; fi
          git push origin HEAD:feature/phase-06-narrative-ledger
          git push origin --delete ops/phase6-polish || true
