name: Phase 4 production code gate

on:
  push:
    branches: [feature/phase-04-truth-store]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  statuses: write
  actions: write

concurrency:
  group: phase-04-production-code
  cancel-in-progress: false

jobs:
  build-production-commit:
    if: github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[phase4-production]')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
      HEAD_REF: feature/phase-04-truth-store
      PHASE_PR: "10"
    steps:
      - name: Cancel obsolete Phase 4 custom runs
        shell: bash
        run: |
          set -euo pipefail
          for status in queued in_progress; do
            gh api "/repos/$GITHUB_REPOSITORY/actions/runs?branch=$HEAD_REF&status=$status&per_page=100" --jq '.workflow_runs[] | [.id,.name] | @tsv' |
            while IFS=$'\t' read -r run_id name; do
              [[ "$run_id" == "$GITHUB_RUN_ID" || "$name" == "CI" || "$name" == "Phase 4 production code gate" ]] && continue
              case "$name" in
                *"Phase 4"*|*"phase 4"*|*"Apply and accept"*|*"Repair and accept"*|*"Harden and accept"*)
                  gh api --method POST "/repos/$GITHUB_REPOSITORY/actions/runs/$run_id/cancel" || true ;;
              esac
            done
          done

      - uses: actions/checkout@v4
        with:
          ref: feature/phase-04-truth-store
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Stop harmlessly when PR is already merged
        shell: bash
        run: |
          set -euo pipefail
          merged="$(gh api "/repos/$GITHUB_REPOSITORY/pulls/$PHASE_PR" --jq '.merged')"
          echo "ALREADY_MERGED=$merged" >> "$GITHUB_ENV"

      - name: Recover generator and materialize production files
        if: env.ALREADY_MERGED != 'true'
        shell: bash
        run: |
          set -euo pipefail
          recovered=""
          for commit in $(git rev-list --all -- scripts/apply_phase4.py); do
            if git cat-file -e "$commit:scripts/apply_phase4.py" 2>/dev/null; then
              git show "$commit:scripts/apply_phase4.py" > scripts/apply_phase4.py
              recovered=1
              break
            fi
          done
          if [[ -n "$recovered" ]]; then
            python3 scripts/apply_phase4.py
          fi
          test -f internal/truth/store.go
          test -f internal/truth/schema.go
          test -f internal/server/truth.go

      - name: Apply final append-only temporal hardening
        if: env.ALREADY_MERGED != 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          schema = Path('internal/truth/schema.go')
          value = schema.read_text()
          value = value.replace('\n\t\tsuperseded_by_event_id TEXT,', '')
          value = value.replace(',\n\t\tFOREIGN KEY(superseded_by_event_id) REFERENCES truth_events(event_id)', '')
          value = value.replace('ON truth_events(entity_type, entity_id, attribute, superseded_by_event_id, effective_chapter);', 'ON truth_events(entity_type, entity_id, attribute, effective_chapter);')
          anchor = '''\tCREATE INDEX truth_events_active_idx
\t\tON truth_events(entity_type, entity_id, attribute, effective_chapter);'''
          replacement = '''\tCREATE INDEX truth_events_active_idx
\t\tON truth_events(entity_type, entity_id, attribute, effective_chapter);
\tCREATE UNIQUE INDEX truth_events_supersede_once_idx
\t\tON truth_events(supersedes_event_id) WHERE supersedes_event_id IS NOT NULL;
\tCREATE TRIGGER truth_events_reject_update
\tBEFORE UPDATE ON truth_events BEGIN
\t\tSELECT RAISE(ABORT, 'truth_events is append-only');
\tEND;
\tCREATE TRIGGER truth_events_reject_delete
\tBEFORE DELETE ON truth_events BEGIN
\t\tSELECT RAISE(ABORT, 'truth_events is append-only');
\tEND;'''
          if 'truth_events_reject_update' not in value:
              value = value.replace(anchor, replacement, 1)
          schema.write_text(value)

          store = Path('internal/truth/store.go')
          text = store.read_text()
          text = text.replace('\n\t"fmt"', '')
          text = text.replace(' AND superseded_by_event_id IS NULL ORDER BY effective_chapter, sequence', ' ORDER BY effective_chapter, sequence')
          text = re.sub(r'''\n\tif normalized\.SupersedesEventID != "" \{\n\t\tchanged, err := tx\.ExecContext\(ctx, `UPDATE truth_events SET superseded_by_event_id=\? WHERE event_id=\? AND superseded_by_event_id IS NULL`, normalized\.EventID, normalized\.SupersedesEventID\).*?\n\t\}\n''', '\n', text, count=1, flags=re.S)
          text = text.replace('''COALESCE(supersedes_event_id,''),
\tCOALESCE(superseded_by_event_id,''), recorded_at FROM truth_events''', '''COALESCE(supersedes_event_id,''),
\tCOALESCE((SELECT successor.event_id FROM truth_events AS successor
\t\tWHERE successor.supersedes_event_id = truth_events.event_id
\t\tORDER BY successor.sequence LIMIT 1),''), recorded_at FROM truth_events''')
          old = '''\t\tgroup := append([]Event(nil), events[index:end]...)
\t\tsort.SliceStable(group, func(i, j int) bool {'''
          new = '''\t\tgroup := append([]Event(nil), events[index:end]...)
\t\teventIndex := make(map[string]Event, len(events))
\t\tfor _, indexed := range events {
\t\t\teventIndex[indexed.EventID] = indexed
\t\t}
\t\tfiltered := group[:0]
\t\tfor _, grouped := range group {
\t\t\tsuperseder, superseded := eventIndex[grouped.SupersededByEventID]
\t\t\tif superseded && superseder.EffectiveChapter <= grouped.EffectiveChapter {
\t\t\t\tcontinue
\t\t\t}
\t\t\tfiltered = append(filtered, grouped)
\t\t}
\t\tgroup = filtered
\t\tif len(group) == 0 {
\t\t\tindex = end
\t\t\tcontinue
\t\t}
\t\tsort.SliceStable(group, func(i, j int) bool {'''
          if old in text:
              text = text.replace(old, new, 1)
          text = text.replace('makeConflict(*current, candidate, "lower-authority retraction rejected", now())', 'makeConflict(*current, candidate, "lower-authority retraction rejected", candidate.RecordedAt)')
          text = text.replace('makeConflict(*current, candidate, "lower-authority assertion rejected", now())', 'makeConflict(*current, candidate, "lower-authority assertion rejected", candidate.RecordedAt)')
          text = text.replace('makeConflict(*effectiveWinner, competing, "competing assertion at the same temporal key", now())', 'makeConflict(*effectiveWinner, competing, "competing assertion at the same temporal key", competing.RecordedAt)')
          text = text.replace('func rebuildKey(ctx context.Context, tx *sql.Tx, entityType, entityID, attribute string, now func() time.Time)', 'func rebuildKey(ctx context.Context, tx *sql.Tx, entityType, entityID, attribute string, _ func() time.Time)')
          store.write_text(text)

          project = Path('internal/project/truth.go')
          project.write_text(project.read_text().replace('ErrValidation)', 'errors.New("invalid project id"))').replace('ErrNotFound)', 'errors.New("project not found"))'))

          server = Path('internal/server/truth.go')
          server.write_text(server.read_text().replace('requiredNonNegativeInt', 'truthRequiredNonNegativeInt').replace('queryInt', 'truthQueryInt'))

          tests = Path('internal/truth/store_test.go')
          ttext = tests.read_text().replace('Migrations: []migrate.Migration{ProjectMigration}', 'Migrations: []migrate.Migration{{Version: 1, Name: "truth_test_base", SQL: `CREATE TABLE truth_test_base(id INTEGER PRIMARY KEY);`}, ProjectMigration}')
          marker = 'func TestBoundedRebuildIsDeterministic'
          if 'TestSupersedePreservesEarlierTemporalHistory' not in ttext:
              ttext = ttext.replace(marker, r'''func TestSupersedePreservesEarlierTemporalHistory(t *testing.T) {
\tstore := newTestStore(t)
\toriginal := appendJSON(t, store, "history-original", "character", "lin", "name", 1, "Lin", AuthorityCanonical, "")
\tappendJSON(t, store, "history-correction", "character", "lin", "name", 8, "Linn", AuthorityHuman, original.Event.EventID)
\tbefore, err := store.FactsAsOf(context.Background(), Query{Chapter: 7, EntityID: "lin", Attribute: "name"})
\tif err != nil || factString(t, before) != "Lin" { t.Fatalf("supersede erased history: facts=%+v err=%v", before.Facts, err) }
\tafter, err := store.FactsAsOf(context.Background(), Query{Chapter: 8, EntityID: "lin", Attribute: "name"})
\tif err != nil || factString(t, after) != "Linn" { t.Fatalf("supersede boundary failed: facts=%+v err=%v", after.Facts, err) }
}

''' + marker, 1)
          if 'TestEventLogRejectsMutation' not in ttext:
              ttext += r'''
func TestEventLogRejectsMutation(t *testing.T) {
\tstore := newTestStore(t)
\tresult := appendJSON(t, store, "immutable", "character", "lin", "health", 1, "alive", AuthorityCanonical, "")
\tif _, err := store.db.Exec(`UPDATE truth_events SET value_json='"dead"' WHERE event_id=?`, result.Event.EventID); err == nil { t.Fatal("truth update unexpectedly succeeded") }
\tif _, err := store.db.Exec(`DELETE FROM truth_events WHERE event_id=?`, result.Event.EventID); err == nil { t.Fatal("truth delete unexpectedly succeeded") }
}
'''
          tests.write_text(ttext)
          PY
          gofmt -w internal/truth internal/project/truth.go internal/project/truth_test.go internal/server/truth.go internal/server/truth_test.go internal/project/repository.go internal/server/server.go internal/server/openapi_test.go

      - name: Run complete production validation
        if: env.ALREADY_MERGED != 'true'
        shell: bash
        env:
          GOWORK: "off"
        run: |
          set -euo pipefail
          go mod tidy
          go mod download all
          test -z "$(gofmt -l .)"
          go vet ./...
          go test -buildvcs=false -count=1 ./...
          go test -race -buildvcs=false -count=1 ./internal/db/migrate ./internal/project ./internal/truth/... ./internal/server/...
          NOVELFORGE_HEAVY_TESTS=1 go test -buildvcs=false -count=1 ./internal/truth -run '^TestQueryPlanAt100K$'
          CGO_ENABLED=0 go build -trimpath ./cmd/novelforge
          git diff --exit-code -- go.mod go.sum
          go run ./scripts/dependency_license_inventory.go -check docs/DEPENDENCY_LICENSES.md
          cd web
          npm ci --ignore-scripts --no-audit --no-fund
          npm run check
          npm test
          npm run build
          npm audit --audit-level=high
          cd ..
          node scripts/frontend_dependency_license_inventory.mjs --check docs/FRONTEND_DEPENDENCY_LICENSES.md
          git diff --exit-code -- web/package-lock.json web/dist
          sh -n scripts/install.sh scripts/uninstall.sh scripts/install_lifecycle_smoke.sh scripts/brand_audit.sh
          sh scripts/install_lifecycle_smoke.sh
          sh scripts/brand_audit.sh

      - name: Commit only production paths
        if: env.ALREADY_MERGED != 'true'
        shell: bash
        run: |
          set -euo pipefail
          git add README.md docs/TRUTH_STORE.md docs/IMPLEMENTATION_STATUS.md \
            internal/truth internal/project/repository.go internal/project/truth.go internal/project/truth_test.go \
            internal/server/server.go internal/server/truth.go internal/server/truth_test.go \
            internal/server/openapi.json internal/server/openapi_test.go
          if git ls-files --error-unmatch scripts/apply_phase4.py >/dev/null 2>&1; then
            git rm -f scripts/apply_phase4.py
          else
            rm -f scripts/apply_phase4.py
          fi
          forbidden="$(git diff --cached --name-only | grep -E '(^\.github/|^vendor/|^\.generated/|\.db$|\.sqlite$|\.pem$|\.key$)' || true)"
          test -z "$forbidden" || { printf 'non-production staged paths:\n%s\n' "$forbidden"; exit 1; }
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'feat: complete append-only temporal truth store [phase4-production]'
            git push origin "HEAD:$HEAD_REF"
          fi
          final_head="$(git rev-parse HEAD)"
          gh api --method POST "/repos/$GITHUB_REPOSITORY/statuses/$final_head" -f state=success -f context='phase4/production-code' -f description='Truth Store full, race, 100k, frontend, lifecycle and license gates passed'
          gh pr edit "$PHASE_PR" --repo "$GITHUB_REPOSITORY" --add-label 'phase4-code-ready' || true
