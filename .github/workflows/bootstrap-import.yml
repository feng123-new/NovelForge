name: Bootstrap NovelForge from ainovel-cli

on:
  workflow_dispatch:
  push:
    branches: [main]
  issues:
    types: [opened]

permissions:
  contents: write

concurrency:
  group: novelforge-bootstrap
  cancel-in-progress: false

jobs:
  import-upstream:
    if: github.repository == 'feng123-new/NovelForge'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout bootstrap repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Stop when import already completed
        id: guard
        shell: bash
        run: |
          if git show origin/main:UPSTREAM_BASE.md >/dev/null 2>&1; then
            echo "done=true" >> "$GITHUB_OUTPUT"
          else
            echo "done=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Fetch and sanitize ainovel-cli history
        if: steps.guard.outputs.done != 'true'
        shell: bash
        run: |
          cp .github/workflows/bootstrap-import.yml "$RUNNER_TEMP/bootstrap-import.yml"
          git remote add ainovel-upstream https://github.com/voocel/ainovel-cli.git
          git fetch --no-tags ainovel-upstream main
          git checkout -B novelforge-import ainovel-upstream/main
          FILTER_BRANCH_SQUELCH_WARNING=1 git filter-branch --force \
            --index-filter 'git rm -r --cached --ignore-unmatch .github/workflows' \
            --prune-empty -- novelforge-import
          mkdir -p .github/workflows
          cp "$RUNNER_TEMP/bootstrap-import.yml" .github/workflows/bootstrap-import.yml

      - name: Record exact upstream base
        if: steps.guard.outputs.done != 'true'
        shell: bash
        run: |
          cat > UPSTREAM_BASE.md <<'EOF'
          # NovelForge upstream base

          NovelForge was imported from `voocel/ainovel-cli` with its commit graph, authors, dates, and messages retained.

          - Upstream repository: https://github.com/voocel/ainovel-cli
          - Upstream branch: `main`
          - Original upstream commit: `c0900290be8dfbae4d1614726e48b53259efbd47`
          - Upstream commit date: 2026-08-25
          - License: Apache License 2.0

          GitHub Actions workflow paths were removed from every imported historical commit because GitHub does not allow an Actions installation token to introduce workflow files from fetched history. This rewrites commit SHAs but preserves source history outside `.github/workflows`, the parent graph, authorship, timestamps, and commit messages. NovelForge-owned workflows are added in explicit local commits.

          Restore the long-lived upstream remote in a new clone with:

          ```bash
          git remote add ainovel-upstream https://github.com/voocel/ainovel-cli.git
          git fetch ainovel-upstream --tags
          ```
          EOF
          git config user.name "NovelForge Bootstrap"
          git config user.email "actions@users.noreply.github.com"
          git add UPSTREAM_BASE.md .github/workflows/bootstrap-import.yml
          git commit -m "chore: import ainovel-cli as NovelForge base"

      - name: Set up Go
        if: steps.guard.outputs.done != 'true'
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify imported baseline
        if: steps.guard.outputs.done != 'true'
        run: |
          test -z "$(gofmt -l .)"
          GOWORK=off go vet ./...
          GOWORK=off go test -buildvcs=false -count=1 ./...

      - name: Publish preserved-history baseline
        if: steps.guard.outputs.done != 'true'
        shell: bash
        run: git push origin HEAD:main --force
