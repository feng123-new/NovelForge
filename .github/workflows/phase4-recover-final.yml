name: Phase 4 final recovery

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: phase4-final-recovery-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  generate-test-commit:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'feature/phase-04-truth-store'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Generate, validate, and publish the clean Phase 4 implementation
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          GOWORK: "off"
        run: |
          cp .github/scripts/phase4_recover_generate.py /tmp/phase4_recover_generate.py
          python3 .github/scripts/phase4_recover_patch_all.py /tmp/phase4_recover_generate.py
          python3 .github/scripts/phase4_recover_patch_root.py /tmp/phase4_recover_generate.py
          python3 .github/scripts/phase4_recover_patch_migrations.py /tmp/phase4_recover_generate.py
          python3 .github/scripts/phase4_recover_patch_temporal.py /tmp/phase4_recover_generate.py
          python3 -m py_compile /tmp/phase4_recover_generate.py

          git fetch origin main "$HEAD_REF"
          git reset --hard origin/main
          python3 /tmp/phase4_recover_generate.py "$GITHUB_WORKSPACE"

          gofmt -w \
            internal/truthstore \
            internal/project/truth.go \
            internal/project/truth_migration.go \
            internal/project/truth_test.go \
            internal/server/truth.go \
            internal/server/truth_test.go \
            internal/server/server.go \
            internal/server/openapi_test.go

          go test -buildvcs=false -count=1 ./internal/truthstore ./internal/project ./internal/server/...
          NOVELFORGE_SCALE_TEST=1 go test -buildvcs=false -count=1 ./internal/truthstore -run '^TestHundredThousandFactTemporalQueryUsesIndex$'
          go test -race -buildvcs=false -count=1 ./internal/truthstore ./internal/project ./internal/server/...
          go vet ./...
          go test -buildvcs=false -count=1 ./...
          CGO_ENABLED=0 go build -trimpath ./cmd/novelforge
          git diff --check

          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat: implement temporal structured truth store"
          git push --force origin "HEAD:$HEAD_REF"
