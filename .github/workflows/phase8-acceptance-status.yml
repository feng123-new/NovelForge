name: Phase 8 temporary acceptance status update

on:
  push:
    branches:
      - docs/phase-08-acceptance
    paths:
      - .github/workflows/phase8-acceptance-status.yml

permissions:
  contents: write

jobs:
  update-status:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/phase-08-acceptance
      - name: Generate implementation status
        run: python scripts/phase8_acceptance_status.py
      - name: Commit implementation status
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/IMPLEMENTATION_STATUS.md
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "Implementation status already matches the accepted production evidence."
            exit 0
          fi
          git commit -m "docs: record Phase 8 implementation status"
          git push origin HEAD:docs/phase-08-acceptance
