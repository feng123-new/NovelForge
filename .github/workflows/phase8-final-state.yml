name: Phase 8 temporary final-state update

on:
  push:
    branches:
      - docs/phase-08-final-state
    paths:
      - .github/workflows/phase8-final-state.yml

permissions:
  contents: write

jobs:
  update-final-state:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/phase-08-final-state
      - name: Update final Phase 8 status documents
        run: python scripts/phase8_finalize_status.py
      - name: Commit final status documents
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/IMPLEMENTATION_STATUS.md docs/PHASE_08_ACCEPTANCE.md
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "Final Phase 8 status documents are already aligned."
            exit 0
          fi
          git commit -m "docs: align Phase 8 final accepted state"
          git push origin HEAD:docs/phase-08-final-state
