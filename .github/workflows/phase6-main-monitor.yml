name: Temporary Phase 6 merged-main CI monitor

on:
  push:
    branches:
      - ops/phase6-main-ci-monitor

permissions:
  actions: read
  contents: write
  pull-requests: read

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Verify merged Phase 6 main and prepare acceptance record
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: '22'
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${REPOSITORY}"
          header=(-H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28')

          pr="$(curl -fsSL "${header[@]}" "${api}/pulls/${PR_NUMBER}")"
          test "$(jq -r '.merged' <<<"${pr}")" = true
          feature_head="$(jq -r '.head.sha' <<<"${pr}")"
          merge_sha="$(jq -r '.merge_commit_sha' <<<"${pr}")"
          test -n "${feature_head}"
          test -n "${merge_sha}"
          test "${merge_sha}" != null

          pr_runs="$(curl -fsSL "${header[@]}" "${api}/actions/runs?event=pull_request&head_sha=${feature_head}&per_page=20")"
          pr_run="$(jq -c --arg sha "${feature_head}" --argjson pr "${PR_NUMBER}" '[.workflow_runs[] | select(.name == "CI" and .head_sha == $sha and .status == "completed" and .conclusion == "success" and any(.pull_requests[]?; .number == $pr))] | sort_by(.created_at) | last // empty' <<<"${pr_runs}")"
          test -n "${pr_run}"
          pr_run_id="$(jq -r '.id' <<<"${pr_run}")"

          main_run=''
          main_run_id=''
          for _ in $(seq 1 150); do
            runs="$(curl -fsSL "${header[@]}" "${api}/actions/runs?event=push&head_sha=${merge_sha}&branch=main&per_page=20")"
            main_run="$(jq -c --arg sha "${merge_sha}" '[.workflow_runs[] | select(.name == "CI" and .head_sha == $sha)] | sort_by(.created_at) | last // empty' <<<"${runs}")"
            if [[ -n "${main_run}" ]]; then
              status="$(jq -r '.status' <<<"${main_run}")"
              main_run_id="$(jq -r '.id' <<<"${main_run}")"
              if [[ "${status}" = completed ]]; then
                test "$(jq -r '.conclusion' <<<"${main_run}")" = success
                break
              fi
            fi
            sleep 8
          done
          test -n "${main_run_id}"
          test "$(jq -r '.status' <<<"${main_run}")" = completed
          test "$(jq -r '.conclusion' <<<"${main_run}")" = success

          jobs="$(curl -fsSL "${header[@]}" "${api}/actions/runs/${main_run_id}/jobs?per_page=100")"
          jq -e '
            def succeeded($name): any(.jobs[]; .name == $name and .status == "completed" and .conclusion == "success");
            succeeded("Go lint, test and build") and
            succeeded("Frontend check, test and build") and
            succeeded("Windows test and build") and
            succeeded("Docker build")
          ' <<<"${jobs}" >/dev/null

          git init work
          cd work
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${REPOSITORY}.git"
          git fetch --depth=1 origin "${merge_sha}"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "${merge_sha}"
          test "$(find .github/workflows -maxdepth 1 -type f -printf '%f\n' | sort | tr '\n' ' ')" = 'ci.yml '

          export PHASE6_FEATURE_HEAD="${feature_head}"
          export PHASE6_PR_RUN="${pr_run_id}"
          export PHASE6_MERGE_SHA="${merge_sha}"
          export PHASE6_MAIN_RUN="${main_run_id}"
          python3 - <<'PY'
          from __future__ import annotations
          import os
          import re
          from pathlib import Path

          path = Path('docs/IMPLEMENTATION_STATUS.md')
          text = path.read_text(encoding='utf-8')
          feature = os.environ['PHASE6_FEATURE_HEAD']
          pr_run = os.environ['PHASE6_PR_RUN']
          merge = os.environ['PHASE6_MERGE_SHA']
          main_run = os.environ['PHASE6_MAIN_RUN']

          pending_state = '- Phase 6 implementation is on `feature/phase-06-narrative-ledger`; acceptance evidence is pending.\n'
          evidence_state = (
              f'- Phase 6 production PR #22 was squash-merged as `{merge}`.\n'
              f'- Phase 6 exact-head PR CI `{pr_run}` and merge-triggered main CI `{main_run}` both succeeded.\n'
          )
          if pending_state in text:
              text = text.replace(pending_state, evidence_state, 1)
          elif evidence_state not in text:
              marker = '## Phase status\n'
              if marker not in text:
                  raise SystemExit('phase status marker not found')
              text = text.replace(marker, evidence_state + '\n' + marker, 1)

          text = re.sub(
              r'^\| 6 — Narrative Ledger \| implementation complete; acceptance pending \|.*$',
              '| 6 — Narrative Ledger | complete | PR #22 plus exact-head and merged-main CI passed; authoritative ledger, temporal boundaries, API, Web and Scenario E are accepted. |',
              text,
              count=1,
              flags=re.MULTILINE,
          )

          phase6_index = text.find('## Phase 6')
          if phase6_index < 0:
              raise SystemExit('Phase 6 section not found')
          prefix = text[:phase6_index]
          section = text[phase6_index:]

          section = section.replace('- Exact final Phase 6 PR CI: pending.', f'- Final feature head: `{feature}`.')
          section = section.replace('- Squash merge: pending.', '- Final delivery PR: #22 — `feat: add Narrative Ledger and temporal story obligations`.')
          section = section.replace('- Merge-triggered main CI: pending.', f'- PR CI run `{pr_run}`: **success** on the exact final head; Go, Frontend, Windows and Docker all succeeded.\n- Squash merge: **success**, main commit `{merge}`.\n- Merge-triggered main CI run `{main_run}`: **success** on the exact merge commit; Go, Frontend, Windows and Docker all succeeded.')

          replacements = {
              '### Final Head Commit\n\nPending exact final-head CI.': f'### Final Head Commit\n\n`{feature}`',
              '### Pull Request\n\nPending.': '### Pull Request\n\n[#22 — feat: add Narrative Ledger and temporal story obligations](https://github.com/feng123-new/NovelForge/pull/22)',
              '### PR CI Result\n\nPending exact final-head workflow.': f'### PR CI Result\n\n`{pr_run}` — success',
              '### Main Merge Commit\n\nPending.': f'### Main Merge Commit\n\n`{merge}`',
              '### Main CI Result\n\nPending.': f'### Main CI Result\n\n`{main_run}` — success',
          }
          for old, new in replacements.items():
              if old in section:
                  section = section.replace(old, new, 1)

          if '### Exact Resume Point' not in section:
              section = section.rstrip() + '''

### Exact Resume Point

1. Fetch `origin/main` and verify the latest workflow on that exact commit is successful.
2. Create `feature/phase-07-context-compiler` from the exact fetched main SHA.
3. Implement Context Compiler, FTS5 and bounded retrieval without reopening the accepted Phase 6 scope.
'''

          path.write_text(prefix + section, encoding='utf-8')
          PY

          git checkout -B docs/phase-06-acceptance
          git add docs/IMPLEMENTATION_STATUS.md
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs: record Phase 6 acceptance evidence'
          git push --force origin HEAD:refs/heads/docs/phase-06-acceptance

          git checkout --detach "${merge_sha}"
          git checkout -B ops/phase6-main-green
          mkdir -p .phase6
          jq -n \
            --arg feature_head "${feature_head}" \
            --arg pr_run "${pr_run_id}" \
            --arg merge_sha "${merge_sha}" \
            --arg main_run "${main_run_id}" \
            --arg checked "$(date -u +%FT%TZ)" \
            '{pr:22, feature_head:$feature_head, pr_ci_run:$pr_run, merge_sha:$merge_sha, main_ci_run:$main_run, required_jobs_success:true, checked_at:$checked}' \
            > .phase6/main-ci.json
          git add .phase6/main-ci.json
          git commit -m 'chore: record Phase 6 merged-main CI success'
          git push --force origin HEAD:refs/heads/ops/phase6-main-green

          cd ..
          curl -fsSL -X DELETE "${header[@]}" "${api}/git/refs/heads/ops%2Fphase6-main-ci-monitor" || true
