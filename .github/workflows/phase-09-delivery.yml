name: Phase 9 post-merge cleanup
on:
  push:
    branches: [ops/phase-09-delivery]
permissions:
  contents: write
concurrency:
  group: phase-09-delivery
  cancel-in-progress: false
jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify merge, archive and prune only this delivery's two refs
        env:
          GH_TOKEN: ${{ github.token }}
        run: python .phase9/cleanup.py
