name: Phase 9 documentation review
on:
  push:
    branches: [ops/phase-09-delivery]
permissions:
  contents: write
concurrency:
  group: phase-09-delivery
  cancel-in-progress: true
jobs:
  documentation:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Align only current docs and verify unchanged tested code
        run: python .phase9/finalize_docs.py
