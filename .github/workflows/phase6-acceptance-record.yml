name: Temporary Phase 6 acceptance record

on:
  push:
    branches:
      - docs/phase-06-acceptance

permissions:
  contents: write

jobs:
  record:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/phase-06-acceptance
          fetch-depth: 0
      - name: Record immutable Phase 6 evidence
        shell: bash
        env:
          PHASE6_SECTION_B64: 
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import os
          from pathlib import Path

          path = Path('docs/IMPLEMENTATION_STATUS.md')
          text = path.read_text(encoding='utf-8')
          evidence = "- Phase 6 production PR #24 exact-head CI `33636642108` succeeded; squash merge `ef3d144567caadcdf16af809c636b3858d9eb8a2` passed merged-main CI `33637529694`.\n"
          anchor = "- Phase 5 acceptance record PR #20 CI `33591592779` succeeded; its squash merge `0934fc98bcedd7aa7a33baa84984e5cdef0196ed` passed main CI `33591712938`.\n"
          if evidence not in text:
              if anchor not in text:
                  raise SystemExit('repository evidence anchor missing')
              text = text.replace(anchor, anchor + evidence, 1)

          old = "| 6–13 | not started | Phase 6 begins from the latest accepted main; no Phase 6 production work is included in Phase 5. |"
          new = "| 6 — Narrative Ledger | complete | Production code, API, OpenAPI, Web, tests and docs merged in PR #24; exact-head and merged-main CI passed. |\n| 7–13 | not started | Phase 7 begins from the exact accepted main after this evidence record is merged and validated. |"
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit('phase table anchor missing')

          if '## Phase 6 — Narrative Ledger' not in text:
              text += base64.b64decode(os.environ['PHASE6_SECTION_B64']).decode('utf-8')
          path.write_text(text, encoding='utf-8')
          PY

          rm .github/workflows/phase6-acceptance-record.yml
          git add docs/IMPLEMENTATION_STATUS.md .github/workflows/phase6-acceptance-record.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs: record Phase 6 acceptance evidence'
          git push origin HEAD:docs/phase-06-acceptance
