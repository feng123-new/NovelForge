name: Temporary Phase 5-7 source snapshot

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  contents: read

jobs:
  snapshot:
    if: github.event.pull_request.head.ref == 'ops/source-snapshot-phase567'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 1
      - name: Package verified main source
        shell: bash
        run: |
          set -euo pipefail
          tar --exclude='.git' --exclude='node_modules' -czf /tmp/NovelForge-main.tgz .
          sha256sum /tmp/NovelForge-main.tgz > /tmp/NovelForge-main.tgz.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: novelforge-main-source-${{ github.run_id }}
          path: |
            /tmp/NovelForge-main.tgz
            /tmp/NovelForge-main.tgz.sha256
          if-no-files-found: error
          retention-days: 1
