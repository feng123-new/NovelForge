name: Phase 11 post-merge cleanup

on:
  push:
    branches: [ops/phase11-delivery]

permissions:
  contents: write

concurrency:
  group: phase11-delivery
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify exact merge and archive before pruning two refs
        run: python .phase11/cleanup.py
