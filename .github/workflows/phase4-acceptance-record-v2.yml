name: Phase 4 permanent acceptance gate

on:
  pull_request:
    branches: [main]

permissions:
  actions: write
  contents: write
  pull-requests: write

concurrency:
  group: phase4-permanent-acceptance-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  finalize:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'docs/phase-04-final-acceptance'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      DOC_PR: ${{ github.event.pull_request.number }}
      DOC_REF: ${{ github.event.pull_request.head.ref }}
      START_HEAD: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Cancel superseded Phase 4 documentation runs
        run: |
          runs="$(gh api --method GET "repos/$REPO/actions/runs" -f branch="$DOC_REF" -F per_page=100)"
          printf '%s' "$runs" | jq -r ".workflow_runs[] | select(.id != $GITHUB_RUN_ID) | select(.status == \"queued\" or .status == \"in_progress\") | select(.name | startswith(\"Phase 4\")) | .id" |
            while read -r run_id; do
              test -z "$run_id" || gh api -X POST "repos/$REPO/actions/runs/$run_id/cancel" >/dev/null 2>&1 || true
            done

      - name: Wait for clean feature merge and exact main CI
        id: evidence
        run: |
          feature_head=''
          merge_sha=''
          feature_run=''
          main_run=''

          for attempt in $(seq 1 540); do
            feature="$(gh api "repos/$REPO/pulls/10")"
            if test "$(printf '%s' "$feature" | jq -r .merged)" = true; then
              feature_head="$(printf '%s' "$feature" | jq -r .head.sha)"
              merge_sha="$(printf '%s' "$feature" | jq -r .merge_commit_sha)"
              feature_run="$(gh api --method GET "repos/$REPO/actions/runs" -f head_sha="$feature_head" -f event=pull_request -F per_page=100 --jq '.workflow_runs[] | select(.name=="CI" and .conclusion=="success") | .id' | head -n1)"
              main_run="$(gh api --method GET "repos/$REPO/actions/runs" -f head_sha="$merge_sha" -f branch=main -F per_page=100 --jq '.workflow_runs[] | select(.name=="CI" and .event=="push" and .conclusion=="success") | .id' | head -n1)"
              if test -n "$feature_run" && test -n "$main_run"; then
                break
              fi
            fi
            sleep 10
          done

          test -n "$feature_head"
          test -n "$merge_sha"
          test "$merge_sha" != null
          test -n "$feature_run"
          test -n "$main_run"

          files="$(gh api --paginate "repos/$REPO/pulls/10/files?per_page=100" --jq '.[].filename')"
          if printf '%s\n' "$files" | grep -E '(^|/)(phase4[-_](recover|recovery|final|apply|bootstrap|repair|reconcile|semantic|materialize)|apply_phase4|payload\.part|\.phase4/|phase4.*\.patch)|^\.github/workflows/phase4'; then
            echo 'Accepted feature diff contains transition machinery.'
            exit 1
          fi
          for required in \
            internal/truthstore/model.go \
            internal/truthstore/migration.go \
            internal/truthstore/store.go \
            internal/truthstore/rebuild.go \
            internal/server/truth.go \
            internal/server/openapi.json \
            docs/TRUTH_STORE.md; do
            printf '%s\n' "$files" | grep -Fx "$required" >/dev/null
          done

          for run_id in "$feature_run" "$main_run"; do
            for expected in \
              'Go lint, test and build' \
              'Frontend check, test and build' \
              'Windows test and build' \
              'Docker build'; do
              conclusion="$(gh api "repos/$REPO/actions/runs/$run_id/jobs?per_page=100" --jq ".jobs[] | select(.name == \"$expected\") | .conclusion")"
              test "$conclusion" = success
            done
          done

          printf 'feature_head=%s\n' "$feature_head" >> "$GITHUB_OUTPUT"
          printf 'merge_sha=%s\n' "$merge_sha" >> "$GITHUB_OUTPUT"
          printf 'feature_run=%s\n' "$feature_run" >> "$GITHUB_OUTPUT"
          printf 'main_run=%s\n' "$main_run" >> "$GITHUB_OUTPUT"

      - name: Reset onto verified main and write permanent evidence
        id: publish
        env:
          FEATURE_HEAD: ${{ steps.evidence.outputs.feature_head }}
          MERGE_SHA: ${{ steps.evidence.outputs.merge_sha }}
          FEATURE_RUN: ${{ steps.evidence.outputs.feature_run }}
          MAIN_RUN: ${{ steps.evidence.outputs.main_run }}
        run: |
          git fetch origin main "$DOC_REF"
          test "$(git rev-parse "origin/$DOC_REF")" = "$START_HEAD"
          git reset --hard origin/main

          python3 - <<'PY'
          from pathlib import Path
          import os, re

          feature_head = os.environ['FEATURE_HEAD']
          merge_sha = os.environ['MERGE_SHA']
          feature_run = os.environ['FEATURE_RUN']
          main_run = os.environ['MAIN_RUN']

          status = Path('docs/IMPLEMENTATION_STATUS.md')
          text = status.read_text(encoding='utf-8')
          text = re.sub(r'Last updated: .*', 'Last updated: 2026-09-02', text, count=1)
          text = text.replace('Exact next phase: Phase 4 — Structured Truth Store.', 'Exact next phase: Phase 5 — Quality Gate and Chapter Transaction.')
          text = text.replace('Exact next phase: Phase 4 — Structured Truth Store', 'Exact next phase: Phase 5 — Quality Gate and Chapter Transaction')

          old = '| 4–13 | not started | Start Phase 4 from the actual remote main after running the required baseline. |'
          new = (
              f'| 4 — Structured Truth Store | complete | PR #10 merged at `{merge_sha[:8]}`; exact PR CI and merge-triggered main CI passed all required jobs. |\n'
              '| 5–13 | not started | Start Phase 5 only from the verified latest `main`. |'
          )
          if old in text:
              text = text.replace(old, new)
          else:
              text = re.sub(r'^\| 4[^\n]*$', f'| 4 — Structured Truth Store | complete | PR #10 merged at `{merge_sha[:8]}`; exact PR and main CI passed. |', text, flags=re.M)
              if '| 5–13 | not started |' not in text:
                  row = f'| 4 — Structured Truth Store | complete | PR #10 merged at `{merge_sha[:8]}`; exact PR and main CI passed. |'
                  text = text.replace(row, row + '\n| 5–13 | not started | Start Phase 5 only from verified `main`. |')

          acceptance = f'''\n## Phase 4 formal acceptance\n\nPhase 4 — Structured Truth Store is formally complete.\n\n- Pull request: [#10 — feat: add structured truth store](https://github.com/feng123-new/NovelForge/pull/10) — squash merged.\n- Final clean feature head: `{feature_head}`.\n- Exact pull-request CI: [run {feature_run}](https://github.com/feng123-new/NovelForge/actions/runs/{feature_run}) — Go, Frontend, Windows and Docker passed, including Truth race and 100,000-fact temporal-index gates.\n- Squash merge: `{merge_sha}`.\n- Merge-triggered main CI: [run {main_run}](https://github.com/feng123-new/NovelForge/actions/runs/{main_run}) — all four required jobs passed.\n- The merged feature diff contains production source, migrations, tests, OpenAPI and documentation only; recovery scripts, payload fragments, source snapshots and temporary workflows were removed before acceptance.\n\nAccepted boundaries include append-only temporal events, mandatory provenance, deterministic authority ordering, Chapter-N story/knowledge intersections, explicit conflict and supersession handling, bounded/full projection rebuild, verification, transactional per-project migration, persistent idempotency and safe REST/OpenAPI contracts.\n'''
          if '## Phase 4 formal acceptance' not in text:
              pos = text.find('\n## Known issues')
              if pos < 0:
                  pos = text.find('\n## Next phase')
              if pos < 0:
                  pos = len(text)
              text = text[:pos] + acceptance + text[pos:]

          text = text.replace(
              'Truth Store, Quality Gate, Narrative Ledger, Context Compiler, Chapter Versions, Durable Autopilot, Skills/Reference, Lifecycle, Observability and Release remain Phase 4–13.',
              'Quality Gate, Narrative Ledger, Context Compiler, Chapter Versions, Durable Autopilot, Skills/Reference, Lifecycle, Observability and Release remain Phase 5–13.'
          )
          text = text.replace('Create `feature/phase-04-truth-store`', 'Create `feature/phase-05-quality-gate`')
          resume = '''## Exact resume point\n\n1. Fetch and prune the remote repository.\n2. Confirm the actual latest `main` SHA and that Phase 4 main CI remains successful.\n3. Run the complete Go, Frontend, Windows-equivalent, Docker, migration, Truth race and scale baseline.\n4. Create `feature/phase-05-quality-gate` from that verified main SHA.\n5. Implement Librarian, Continuity and Editor contracts, bounded rewrite loops, chapter transactions, Finalize and atomic Truth Commit without weakening Phase 0–4 compatibility or temporal authority boundaries.\n'''
          text = re.sub(r'## Exact resume point\n.*\Z', resume, text, flags=re.S)
          status.write_text(text.rstrip() + '\n', encoding='utf-8')

          Path('docs/PHASE_4_ACCEPTANCE.md').write_text(f'''# Phase 4 — Structured Truth Store Acceptance\n\nStatus: **complete**\n\n## Delivery evidence\n\n| Evidence | Value |\n| --- | --- |\n| Feature PR | [#10](https://github.com/feng123-new/NovelForge/pull/10) |\n| Final clean feature head | `{feature_head}` |\n| Exact PR CI | [run {feature_run}](https://github.com/feng123-new/NovelForge/actions/runs/{feature_run}) |\n| Squash merge | `{merge_sha}` |\n| Merge-triggered main CI | [run {main_run}](https://github.com/feng123-new/NovelForge/actions/runs/{main_run}) |\n\nBoth authoritative CI runs passed Go, Frontend, Windows and Docker. The Go gate includes targeted race coverage and the 100,000-fact temporal query/index test.\n\n## Accepted scope\n\n- Append-only, checksum-verifiable temporal Truth events in each project database.\n- Required provenance including source chapter and source version.\n- Deterministic authority ordering with higher-authority facts protected from silent downgrade.\n- Story-valid and system-knowledge intervals whose intersection prevents future-state leakage.\n- Chapter-N and bounded batch state queries with stable ordering and indexed plans.\n- Explicit unresolved/resolved conflicts, supersession and retraction; no silent last-write-wins canon mutation.\n- Full and chapter-bounded deterministic projection rebuilds with verification digests.\n- Transactional project migration with backup, checksum and rollback behavior.\n- Idempotent Truth writes through the shared persistent idempotency boundary.\n- Secret-free errors, bounded request bodies, REST routes and synchronized OpenAPI 3.1 contracts.\n\n## Clean delivery assertion\n\nThe accepted feature diff contains no Phase 4 recovery scripts, payload fragments, temporary bootstrap workflows, source snapshots or self-modifying CI.\n\n## Next phase\n\nPhase 5 — Quality Gate and Chapter Transaction must start from the latest verified `main`.\n''', encoding='utf-8')
          PY

          rm -rf .phase4
          rm -f scripts/apply_phase4.py
          find .github/scripts -maxdepth 1 -type f -name 'phase4*' -delete 2>/dev/null || true
          find .github/workflows -maxdepth 1 -type f -name 'phase4*' -delete 2>/dev/null || true
          find . -maxdepth 4 -type f \( -name 'payload.part*' -o -name 'phase4*.patch' \) -delete

          git add -A
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs: finalize Phase 4 acceptance record'
          final_head="$(git rev-parse HEAD)"
          git push --force origin "HEAD:refs/heads/$DOC_REF"
          printf 'final_head=%s\n' "$final_head" >> "$GITHUB_OUTPUT"

      - name: Wait for standard CI on permanent documentation head
        id: ci
        env:
          FINAL_HEAD: ${{ steps.publish.outputs.final_head }}
        run: |
          run_id=''
          for attempt in $(seq 1 360); do
            runs="$(gh api --method GET "repos/$REPO/actions/runs" -f head_sha="$FINAL_HEAD" -f event=pull_request -F per_page=100)"
            run_id="$(printf '%s' "$runs" | jq -r '.workflow_runs[] | select(.name=="CI") | .id' | head -n1)"
            if test -n "$run_id"; then
              state="$(gh api "repos/$REPO/actions/runs/$run_id" --jq '[.status, (.conclusion // "")] | join("|")')"
              case "$state" in
                completed\|success) break ;;
                completed\|*) echo "permanent documentation CI failed: $state"; exit 1 ;;
              esac
            fi
            sleep 10
          done
          test -n "$run_id"
          for expected in \
            'Go lint, test and build' \
            'Frontend check, test and build' \
            'Windows test and build' \
            'Docker build'; do
            conclusion="$(gh api "repos/$REPO/actions/runs/$run_id/jobs?per_page=100" --jq ".jobs[] | select(.name == \"$expected\") | .conclusion")"
            test "$conclusion" = success
          done
          printf 'run_id=%s\n' "$run_id" >> "$GITHUB_OUTPUT"

      - name: Mark acceptance PR ready for connector merge
        env:
          FINAL_HEAD: ${{ steps.publish.outputs.final_head }}
          RUN_ID: ${{ steps.ci.outputs.run_id }}
        run: |
          test "$(gh api "repos/$REPO/pulls/$DOC_PR" --jq .head.sha)" = "$FINAL_HEAD"
          test -s docs/PHASE_4_ACCEPTANCE.md
          if test "$(gh api "repos/$REPO/pulls/$DOC_PR" --jq .draft)" = true; then
            gh pr ready "$DOC_PR" --repo "$REPO"
          fi
          gh pr comment "$DOC_PR" --repo "$REPO" --body "Permanent Phase 4 evidence head \`$FINAL_HEAD\` passed standard CI run \`$RUN_ID\` across Go, Frontend, Windows and Docker. Ready for connector-owned squash merge."
