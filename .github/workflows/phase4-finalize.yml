name: Phase 4 acceptance orchestration

on:
  workflow_dispatch:
  pull_request:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: phase-04-acceptance
  cancel-in-progress: false

jobs:
  verify-clean-merge-and-record:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.ref == 'feature/phase-04-truth-store'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
      HEAD_REF: feature/phase-04-truth-store
      PHASE_PR: "10"
      VERIFIED_BASE: 13f084e2ed2f1a57b3b05718e3972fa37248f2c1
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/phase-04-truth-store
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify Phase 4 implementation evidence
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$VERIFIED_BASE" HEAD
          test -d internal/truth
          test "$(find internal/truth -type f -name '*.go' | wc -l)" -ge 3
          test "$(find internal/truth -type f -name '*_test.go' | wc -l)" -ge 1
          grep -R -q 'truth_events' internal
          grep -R -qi 'supersed' internal/truth
          grep -R -qi 'provenance\|authority' internal/truth
          grep -R -qi 'chapter' internal/truth
          grep -R -q '/truth' internal/server
          grep -R -q 'Truth' internal/server/openapi.json
          if git grep -I -n -E '(api[_-]?key|authorization)[[:space:]]*[:=][[:space:]]*["'"'][^$<{]' -- ':!**/*_test.go'; then
            echo 'possible committed credential detected' >&2
            exit 1
          fi

      - name: Go formatting, vet, tests, race and CGo-free build
        shell: bash
        env:
          GOWORK: "off"
        run: |
          set -euo pipefail
          go mod tidy
          go mod download all
          unformatted="$(gofmt -l .)"
          test -z "$unformatted" || { printf 'gofmt required for:\n%s\n' "$unformatted"; exit 1; }
          go vet ./...
          go test -buildvcs=false -count=1 ./...
          go test -race -buildvcs=false -count=1 ./internal/db/migrate ./internal/project ./internal/truth/... ./internal/server/...
          CGO_ENABLED=0 go build -trimpath ./cmd/novelforge
          git diff --exit-code -- go.mod go.sum
          go run ./scripts/dependency_license_inventory.go -check docs/DEPENDENCY_LICENSES.md

      - name: Frontend exact replay, checks, tests, build and policy gates
        shell: bash
        run: |
          set -euo pipefail
          cd web
          npm ci --ignore-scripts --no-audit --no-fund
          npm run check
          npm test
          npm run build
          npm audit --audit-level=high
          cd ..
          node scripts/frontend_dependency_license_inventory.mjs --check docs/FRONTEND_DEPENDENCY_LICENSES.md
          git diff --exit-code -- web/package-lock.json web/dist

      - name: Remove temporary workflows and restore permanent CI
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git show origin/main:.github/workflows/ci.yml > .github/workflows/ci.yml
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/ci.yml')
          text = p.read_text()
          if '  workflow_dispatch:\n' not in text:
              text = text.replace('  pull_request:\n', '  pull_request:\n  workflow_dispatch:\n', 1)
          text = text.replace(
              './internal/db/migrate ./internal/project ./internal/server/...',
              './internal/db/migrate ./internal/project ./internal/truth/... ./internal/server/...',
          )
          p.write_text(text)
          PY
          rm -f .github/workflows/phase4-bootstrap.yml
          rm -f .github/workflows/phase4-finalize.yml
          git add -A .github/workflows
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'chore: finalize permanent Phase 4 CI'
            git push origin "HEAD:$HEAD_REF"
          fi
          echo "CLEAN_HEAD=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Dispatch and require permanent CI on final PR head
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run ci.yml --ref "$HEAD_REF"
          for _ in $(seq 1 180); do
            run_json="$(gh api "/repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$CLEAN_HEAD&event=workflow_dispatch&per_page=20")"
            run_id="$(jq -r '.workflow_runs[] | select(.name == "CI") | .id' <<<"$run_json" | head -1)"
            status="$(jq -r --argjson id "${run_id:-0}" '.workflow_runs[] | select(.id == $id) | .status' <<<"$run_json" | head -1)"
            conclusion="$(jq -r --argjson id "${run_id:-0}" '.workflow_runs[] | select(.id == $id) | .conclusion' <<<"$run_json" | head -1)"
            if [[ "$status" == completed ]]; then
              [[ "$conclusion" == success ]] || exit 1
              echo "PR_CI_RUN=$run_id" >> "$GITHUB_ENV"
              break
            fi
            sleep 10
          done
          test -n "${run_id:-}"
          test "$status" = completed
          test "$conclusion" = success

      - name: Ready and squash-merge Phase 4 PR
        shell: bash
        run: |
          set -euo pipefail
          gh pr ready "$PHASE_PR" --repo "$GITHUB_REPOSITORY" || true
          merge_json="$(gh api --method PUT "/repos/$GITHUB_REPOSITORY/pulls/$PHASE_PR/merge" \
            -f merge_method=squash \
            -f sha="$CLEAN_HEAD" \
            -f commit_title='feat: add structured truth store (#10)' \
            -f commit_message='Complete Phase 4 with a versioned temporal Truth Store, deterministic projections, provenance and authority controls, conflict and supersede semantics, Chapter-N safe reads, bounded rebuilds, Truth APIs, OpenAPI contracts and full cross-platform validation.')"
          jq -e '.merged == true' <<<"$merge_json"
          merge_sha="$(jq -r '.sha' <<<"$merge_json")"
          echo "PHASE_MERGE_SHA=$merge_sha" >> "$GITHUB_ENV"

      - name: Dispatch and require CI on Phase 4 main merge
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run ci.yml --ref main
          for _ in $(seq 1 180); do
            run_json="$(gh api "/repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$PHASE_MERGE_SHA&event=workflow_dispatch&per_page=20")"
            run_id="$(jq -r '.workflow_runs[] | select(.name == "CI") | .id' <<<"$run_json" | head -1)"
            status="$(jq -r --argjson id "${run_id:-0}" '.workflow_runs[] | select(.id == $id) | .status' <<<"$run_json" | head -1)"
            conclusion="$(jq -r --argjson id "${run_id:-0}" '.workflow_runs[] | select(.id == $id) | .conclusion' <<<"$run_json" | head -1)"
            if [[ "$status" == completed ]]; then
              [[ "$conclusion" == success ]] || exit 1
              echo "MAIN_CI_RUN=$run_id" >> "$GITHUB_ENV"
              break
            fi
            sleep 10
          done
          test -n "${run_id:-}"
          test "$status" = completed
          test "$conclusion" = success

      - name: Publish exact Phase 4 acceptance evidence
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B docs/phase-04-acceptance origin/main
          python3 - <<'PY'
          from pathlib import Path
          import os
          p = Path('docs/IMPLEMENTATION_STATUS.md')
          text = p.read_text()
          state = f'''- Phase 4 pull request: [#10 — feat: add structured truth store](https://github.com/{os.environ['GITHUB_REPOSITORY']}/pull/10) — merged.\n- Phase 4 final PR head: `{os.environ['CLEAN_HEAD']}`.\n- Phase 4 final PR CI: run `{os.environ['PR_CI_RUN']}` — success.\n- Phase 4 main merge commit: `{os.environ['PHASE_MERGE_SHA']}`.\n- Phase 4 merged-main CI: run `{os.environ['MAIN_CI_RUN']}` — success.\n- Exact next phase: Phase 5 — Quality Gate and chapter transaction.\n'''
          marker = '- Exact next phase: Phase 4 — Structured Truth Store.\n'
          if marker in text:
              text = text.replace(marker, state, 1)
          elif 'Phase 4 pull request:' not in text:
              text = text.replace('## Repository state\n\n', '## Repository state\n\n' + state, 1)
          text = text.replace(
              '| 4–13 | not started | Start Phase 4 from the actual remote main after running the required baseline. |',
              '| 4 — Structured Truth Store | complete | PR #10 merged; final PR CI and merged-main CI passed. |\n| 5–13 | not started | Begin Phase 5 from the verified Phase 4 main commit. |',
          )
          appendix = f'''\n## Phase 4 acceptance evidence\n\n- Final PR head: `{os.environ['CLEAN_HEAD']}`.\n- Final PR CI run: `{os.environ['PR_CI_RUN']}` — success.\n- Squash merge: `{os.environ['PHASE_MERGE_SHA']}`.\n- Merge-triggered/explicit main CI run: `{os.environ['MAIN_CI_RUN']}` — success.\n- Delivered: append-only Truth events, deterministic temporal projections, authority/provenance, conflicts and supersede, Chapter-N safe queries, bounded rebuild, REST/OpenAPI contracts, migration/concurrency/index regression tests.\n'''
          if '## Phase 4 acceptance evidence' not in text:
              text += appendix
          p.write_text(text)
          PY
          git add docs/IMPLEMENTATION_STATUS.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs: finalize Phase 4 acceptance record'
          git push --force origin HEAD:docs/phase-04-acceptance
          docs_pr="$(gh pr create --repo "$GITHUB_REPOSITORY" --base main --head docs/phase-04-acceptance \
            --title 'docs: finalize Phase 4 acceptance record' \
            --body "Records PR #10, final PR CI run $PR_CI_RUN, squash merge $PHASE_MERGE_SHA and merged-main CI run $MAIN_CI_RUN. This PR changes only the implementation status record.")"
          docs_number="${docs_pr##*/}"
          docs_head="$(git rev-parse HEAD)"
          gh workflow run ci.yml --ref docs/phase-04-acceptance
          for _ in $(seq 1 180); do
            run_json="$(gh api "/repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$docs_head&event=workflow_dispatch&per_page=20")"
            run_id="$(jq -r '.workflow_runs[] | select(.name == "CI") | .id' <<<"$run_json" | head -1)"
            status="$(jq -r --argjson id "${run_id:-0}" '.workflow_runs[] | select(.id == $id) | .status' <<<"$run_json" | head -1)"
            conclusion="$(jq -r --argjson id "${run_id:-0}" '.workflow_runs[] | select(.id == $id) | .conclusion' <<<"$run_json" | head -1)"
            [[ "$status" != completed ]] || { [[ "$conclusion" == success ]] || exit 1; break; }
            sleep 10
          done
          test "$status" = completed
          test "$conclusion" = success
          docs_merge="$(gh api --method PUT "/repos/$GITHUB_REPOSITORY/pulls/$docs_number/merge" -f merge_method=squash -f sha="$docs_head" -f commit_title="docs: finalize Phase 4 acceptance record (#$docs_number)")"
          jq -e '.merged == true' <<<"$docs_merge"
          docs_merge_sha="$(jq -r '.sha' <<<"$docs_merge")"
          gh workflow run ci.yml --ref main
          for _ in $(seq 1 180); do
            run_json="$(gh api "/repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$docs_merge_sha&event=workflow_dispatch&per_page=20")"
            run_id="$(jq -r '.workflow_runs[] | select(.name == "CI") | .id' <<<"$run_json" | head -1)"
            status="$(jq -r --argjson id "${run_id:-0}" '.workflow_runs[] | select(.id == $id) | .status' <<<"$run_json" | head -1)"
            conclusion="$(jq -r --argjson id "${run_id:-0}" '.workflow_runs[] | select(.id == $id) | .conclusion' <<<"$run_json" | head -1)"
            [[ "$status" != completed ]] || { [[ "$conclusion" == success ]] || exit 1; break; }
            sleep 10
          done
          test "$status" = completed
          test "$conclusion" = success
