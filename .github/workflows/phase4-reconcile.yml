name: Phase 4 final reconciler

on:
  push:
    branches: [feature/phase-04-truth-store]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: phase-04-final-reconciler
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      GH_TOKEN: ${{ github.token }}
      HEAD_REF: feature/phase-04-truth-store
      PHASE_PR: "10"
    steps:
      - name: Cancel superseded Phase 4 orchestration runs
        shell: bash
        run: |
          set -euo pipefail
          for status in queued in_progress; do
            gh api "/repos/$GITHUB_REPOSITORY/actions/runs?branch=$HEAD_REF&status=$status&per_page=100" \
              --jq '.workflow_runs[] | [.id,.name] | @tsv' | while IFS=$'\t' read -r run_id name; do
                [[ "$run_id" == "$GITHUB_RUN_ID" ]] && continue
                [[ "$name" == "CI" ]] && continue
                case "$name" in
                  *"Phase 4"*|*"phase 4"*|*"Apply and accept"*|*"Repair and accept"*|*"Harden and accept"*)
                    gh api --method POST "/repos/$GITHUB_REPOSITORY/actions/runs/$run_id/cancel" || true
                    ;;
                esac
              done
          done

      - uses: actions/checkout@v4
        with:
          ref: feature/phase-04-truth-store
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Detect already merged delivery
        shell: bash
        run: |
          set -euo pipefail
          merged="$(gh api "/repos/$GITHUB_REPOSITORY/pulls/$PHASE_PR" --jq '.merged')"
          echo "ALREADY_MERGED=$merged" >> "$GITHUB_ENV"
          if [[ "$merged" == true ]]; then
            echo "PHASE_MERGE_SHA=$(gh api "/repos/$GITHUB_REPOSITORY/pulls/$PHASE_PR" --jq '.merge_commit_sha')" >> "$GITHUB_ENV"
          fi

      - name: Recover generator and apply deterministic production source
        if: env.ALREADY_MERGED != 'true'
        shell: bash
        run: |
          set -euo pipefail
          recovered=""
          for commit in $(git rev-list --all -- scripts/apply_phase4.py); do
            if git cat-file -e "$commit:scripts/apply_phase4.py" 2>/dev/null; then
              git show "$commit:scripts/apply_phase4.py" > scripts/apply_phase4.py
              recovered=1
              break
            fi
          done
          if [[ -z "$recovered" && ! -f internal/truth/store.go ]]; then
            echo 'Phase 4 source generator and production implementation are both unavailable' >&2
            exit 1
          fi
          if [[ -n "$recovered" ]]; then
            python3 scripts/apply_phase4.py
          fi

      - name: Harden temporal, migration and API integration
        if: env.ALREADY_MERGED != 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          store = Path('internal/truth/store.go')
          text = store.read_text()
          text = text.replace('\n\t"fmt"', '')
          text = text.replace(' AND superseded_by_event_id IS NULL ORDER BY effective_chapter, sequence', ' ORDER BY effective_chapter, sequence')
          old = '''\t\tgroup := append([]Event(nil), events[index:end]...)
\t\tsort.SliceStable(group, func(i, j int) bool {'''
          new = '''\t\tgroup := append([]Event(nil), events[index:end]...)
\t\teventIndex := make(map[string]Event, len(events))
\t\tfor _, indexed := range events {
\t\t\teventIndex[indexed.EventID] = indexed
\t\t}
\t\tfiltered := group[:0]
\t\tfor _, grouped := range group {
\t\t\tsuperseder, superseded := eventIndex[grouped.SupersededByEventID]
\t\t\tif superseded && superseder.EffectiveChapter <= grouped.EffectiveChapter {
\t\t\t\tcontinue
\t\t\t}
\t\t\tfiltered = append(filtered, grouped)
\t\t}
\t\tgroup = filtered
\t\tif len(group) == 0 {
\t\t\tindex = end
\t\t\tcontinue
\t\t}
\t\tsort.SliceStable(group, func(i, j int) bool {'''
          if old in text:
              text = text.replace(old, new, 1)
          store.write_text(text)

          project = Path('internal/project/truth.go')
          ptext = project.read_text()
          ptext = ptext.replace('ErrValidation)', 'errors.New("invalid project id"))')
          ptext = ptext.replace('ErrNotFound)', 'errors.New("project not found"))')
          project.write_text(ptext)

          server = Path('internal/server/truth.go')
          stext = server.read_text()
          stext = stext.replace('requiredNonNegativeInt', 'truthRequiredNonNegativeInt')
          stext = stext.replace('queryInt', 'truthQueryInt')
          server.write_text(stext)

          tests = Path('internal/truth/store_test.go')
          ttext = tests.read_text()
          ttext = ttext.replace(
              'Migrations: []migrate.Migration{ProjectMigration}',
              'Migrations: []migrate.Migration{{Version: 1, Name: "truth_test_base", SQL: `CREATE TABLE truth_test_base(id INTEGER PRIMARY KEY);`}, ProjectMigration}',
          )
          marker = 'func TestBoundedRebuildIsDeterministic'
          if 'TestSupersedePreservesEarlierTemporalHistory' not in ttext:
              addition = r'''func TestSupersedePreservesEarlierTemporalHistory(t *testing.T) {
\tstore := newTestStore(t)
\toriginal := appendJSON(t, store, "history-original", "character", "lin", "name", 1, "Lin", AuthorityCanonical, "")
\tappendJSON(t, store, "history-correction", "character", "lin", "name", 8, "Linn", AuthorityHuman, original.Event.EventID)
\tbefore, err := store.FactsAsOf(context.Background(), Query{Chapter: 7, EntityID: "lin", Attribute: "name"})
\tif err != nil || factString(t, before) != "Lin" {
\t\tt.Fatalf("supersede erased prior history: facts=%+v err=%v", before.Facts, err)
\t}
\tafter, err := store.FactsAsOf(context.Background(), Query{Chapter: 8, EntityID: "lin", Attribute: "name"})
\tif err != nil || factString(t, after) != "Linn" {
\t\tt.Fatalf("supersede did not apply at boundary: facts=%+v err=%v", after.Facts, err)
\t}
}

'''
              ttext = ttext.replace(marker, addition + marker, 1)
          tests.write_text(ttext)
          PY
          gofmt -w internal/truth internal/project/truth.go internal/project/truth_test.go internal/server/truth.go internal/server/truth_test.go internal/project/repository.go internal/server/server.go internal/server/openapi_test.go

      - name: Restore permanent CI, add Truth gates and remove temporary files
        if: env.ALREADY_MERGED != 'true'
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git show origin/main:.github/workflows/ci.yml > .github/workflows/ci.yml
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/ci.yml')
          text = p.read_text()
          if '  workflow_dispatch:\n' not in text:
              text = text.replace('  pull_request:\n', '  pull_request:\n  workflow_dispatch:\n', 1)
          text = text.replace('./internal/db/migrate ./internal/project ./internal/server/...', './internal/db/migrate ./internal/project ./internal/truth/... ./internal/server/...')
          marker = '      - name: Validate OpenAPI routes and schemas\n'
          heavy = '''      - name: Truth 100k-row temporal index regression
        env:
          GOWORK: "off"
          NOVELFORGE_HEAVY_TESTS: "1"
        run: go test -buildvcs=false -count=1 ./internal/truth -run '^TestQueryPlanAt100K$'
'''
          if 'Truth 100k-row temporal index regression' not in text:
              text = text.replace(marker, heavy + marker, 1)
          p.write_text(text)
          PY
          find .github/workflows -maxdepth 1 -type f -name 'phase4-*.yml' -delete
          rm -f scripts/apply_phase4.py

      - name: Complete pre-commit validation
        if: env.ALREADY_MERGED != 'true'
        shell: bash
        env:
          GOWORK: "off"
        run: |
          set -euo pipefail
          go mod tidy
          go mod download all
          unformatted="$(gofmt -l .)"
          test -z "$unformatted" || { printf 'gofmt required for:\n%s\n' "$unformatted"; exit 1; }
          go vet ./...
          go test -buildvcs=false -count=1 ./...
          go test -race -buildvcs=false -count=1 ./internal/db/migrate ./internal/project ./internal/truth/... ./internal/server/...
          NOVELFORGE_HEAVY_TESTS=1 go test -buildvcs=false -count=1 ./internal/truth -run '^TestQueryPlanAt100K$'
          CGO_ENABLED=0 go build -trimpath ./cmd/novelforge
          git diff --exit-code -- go.mod go.sum
          go run ./scripts/dependency_license_inventory.go -check docs/DEPENDENCY_LICENSES.md
          cd web
          npm ci --ignore-scripts --no-audit --no-fund
          npm run check
          npm test
          npm run build
          npm audit --audit-level=high
          cd ..
          node scripts/frontend_dependency_license_inventory.mjs --check docs/FRONTEND_DEPENDENCY_LICENSES.md
          git diff --exit-code -- web/package-lock.json web/dist
          sh -n scripts/install.sh scripts/uninstall.sh scripts/install_lifecycle_smoke.sh scripts/brand_audit.sh
          sh scripts/install_lifecycle_smoke.sh
          sh scripts/brand_audit.sh

      - name: Commit production-only tree when changed
        if: env.ALREADY_MERGED != 'true'
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          forbidden="$(git diff --cached --name-only | grep -E '(^vendor/|^\.generated/|\.db$|\.sqlite$|\.pem$|\.key$)' || true)"
          test -z "$forbidden" || { printf 'forbidden files:\n%s\n' "$forbidden"; exit 1; }
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'feat: complete structured temporal truth store'
            git push origin "HEAD:$HEAD_REF"
          fi
          echo "FINAL_HEAD=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Require permanent CI and merge PR 10
        if: env.ALREADY_MERGED != 'true'
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run ci.yml --ref "$HEAD_REF"
          run_id=""; status=""; conclusion=""
          for _ in $(seq 1 180); do
            runs="$(gh api "/repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$FINAL_HEAD&event=workflow_dispatch&per_page=20")"
            run_id="$(jq -r '.workflow_runs[] | select(.name == "CI") | .id' <<<"$runs" | head -1)"
            if [[ -n "$run_id" ]]; then
              status="$(jq -r --argjson id "$run_id" '.workflow_runs[] | select(.id == $id) | .status' <<<"$runs")"
              conclusion="$(jq -r --argjson id "$run_id" '.workflow_runs[] | select(.id == $id) | .conclusion' <<<"$runs")"
              [[ "$status" != completed ]] || { [[ "$conclusion" == success ]] || exit 1; break; }
            fi
            sleep 10
          done
          test "$status" = completed
          test "$conclusion" = success
          echo "PR_CI_RUN=$run_id" >> "$GITHUB_ENV"
          gh pr ready "$PHASE_PR" --repo "$GITHUB_REPOSITORY" || true
          response="$(gh api --method PUT "/repos/$GITHUB_REPOSITORY/pulls/$PHASE_PR/merge" -f merge_method=squash -f sha="$FINAL_HEAD" -f commit_title='feat: add structured truth store (#10)' -f commit_message='Complete Phase 4 with append-only temporal Truth events, deterministic Chapter-N projections, provenance and authority, durable conflicts, explicit supersede, bounded rebuilds, REST/OpenAPI contracts and cross-platform regression gates.')"
          jq -e '.merged == true' <<<"$response"
          echo "PHASE_MERGE_SHA=$(jq -r '.sha' <<<"$response")" >> "$GITHUB_ENV"

      - name: Require CI on Phase 4 main merge
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$ALREADY_MERGED" == true ]]; then
            echo "FINAL_HEAD=$(gh api "/repos/$GITHUB_REPOSITORY/pulls/$PHASE_PR" --jq '.head.sha')" >> "$GITHUB_ENV"
            echo "PR_CI_RUN=already-verified" >> "$GITHUB_ENV"
          fi
          gh workflow run ci.yml --ref main
          run_id=""; status=""; conclusion=""
          for _ in $(seq 1 180); do
            runs="$(gh api "/repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$PHASE_MERGE_SHA&event=workflow_dispatch&per_page=20")"
            run_id="$(jq -r '.workflow_runs[] | select(.name == "CI") | .id' <<<"$runs" | head -1)"
            if [[ -n "$run_id" ]]; then
              status="$(jq -r --argjson id "$run_id" '.workflow_runs[] | select(.id == $id) | .status' <<<"$runs")"
              conclusion="$(jq -r --argjson id "$run_id" '.workflow_runs[] | select(.id == $id) | .conclusion' <<<"$runs")"
              [[ "$status" != completed ]] || { [[ "$conclusion" == success ]] || exit 1; break; }
            fi
            sleep 10
          done
          test "$status" = completed
          test "$conclusion" = success
          echo "MAIN_CI_RUN=$run_id" >> "$GITHUB_ENV"

      - name: Record exact acceptance through a docs PR
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B docs/phase-04-acceptance origin/main
          test -f internal/truth/store.go
          test -z "$(find .github/workflows -maxdepth 1 -type f -name 'phase4-*.yml' -print -quit)"
          python3 - <<'PY'
          from pathlib import Path
          import os
          p = Path('docs/IMPLEMENTATION_STATUS.md')
          text = p.read_text()
          text = text.replace('| 4 — Structured Truth Store | implementation complete; acceptance pending | Temporal event log, projections, provenance, conflicts, supersede, rebuild and Truth APIs are implemented on PR #10. |', '| 4 — Structured Truth Store | complete | PR #10 merged; final PR CI and merged-main CI passed. |')
          text = text.replace('| 4–13 | not started | Start Phase 4 from the actual remote main after running the required baseline. |', '| 4 — Structured Truth Store | complete | PR #10 merged; final PR CI and merged-main CI passed. |\n| 5–13 | not started | Begin Phase 5 from the verified Phase 4 main commit. |')
          text = text.replace('| 5–13 | not started | Begin only after Phase 4 PR and merged-main CI pass. |', '| 5–13 | not started | Begin Phase 5 from the verified Phase 4 main commit. |')
          evidence = f'''\n## Phase 4 acceptance evidence\n\n- Pull request: [#10](https://github.com/{os.environ['GITHUB_REPOSITORY']}/pull/10) — squash merged.\n- Final PR head: `{os.environ['FINAL_HEAD']}`.\n- Final PR CI: run `{os.environ['PR_CI_RUN']}`.\n- Phase 4 merge: `{os.environ['PHASE_MERGE_SHA']}`.\n- Merged-main CI: run `{os.environ['MAIN_CI_RUN']}` — success.\n- Exact next phase: Phase 5 — Quality Gate and chapter transaction.\n'''
          if '## Phase 4 acceptance evidence' not in text:
              text += evidence
          p.write_text(text)
          PY
          git add docs/IMPLEMENTATION_STATUS.md
          if git diff --cached --quiet; then
            echo 'Acceptance record already present'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs: finalize Phase 4 acceptance record'
          docs_head="$(git rev-parse HEAD)"
          git push --force origin HEAD:docs/phase-04-acceptance
          existing="$(gh pr list --repo "$GITHUB_REPOSITORY" --head docs/phase-04-acceptance --base main --state open --json number --jq '.[0].number // empty')"
          if [[ -z "$existing" ]]; then
            url="$(gh pr create --repo "$GITHUB_REPOSITORY" --base main --head docs/phase-04-acceptance --title 'docs: finalize Phase 4 acceptance record' --body "Records PR #10, its final CI, squash merge $PHASE_MERGE_SHA and merged-main CI $MAIN_CI_RUN. This PR changes only the implementation status record.")"
            existing="${url##*/}"
          fi
          gh workflow run ci.yml --ref docs/phase-04-acceptance
          run_id=""; status=""; conclusion=""
          for _ in $(seq 1 180); do
            runs="$(gh api "/repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$docs_head&event=workflow_dispatch&per_page=20")"
            run_id="$(jq -r '.workflow_runs[] | select(.name == "CI") | .id' <<<"$runs" | head -1)"
            if [[ -n "$run_id" ]]; then
              status="$(jq -r --argjson id "$run_id" '.workflow_runs[] | select(.id == $id) | .status' <<<"$runs")"
              conclusion="$(jq -r --argjson id "$run_id" '.workflow_runs[] | select(.id == $id) | .conclusion' <<<"$runs")"
              [[ "$status" != completed ]] || { [[ "$conclusion" == success ]] || exit 1; break; }
            fi
            sleep 10
          done
          test "$status" = completed
          test "$conclusion" = success
          response="$(gh api --method PUT "/repos/$GITHUB_REPOSITORY/pulls/$existing/merge" -f merge_method=squash -f sha="$docs_head" -f commit_title="docs: finalize Phase 4 acceptance record (#$existing)")"
          jq -e '.merged == true' <<<"$response"
          docs_merge_sha="$(jq -r '.sha' <<<"$response")"
          gh workflow run ci.yml --ref main
          for _ in $(seq 1 180); do
            runs="$(gh api "/repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$docs_merge_sha&event=workflow_dispatch&per_page=20")"
            run_id="$(jq -r '.workflow_runs[] | select(.name == "CI") | .id' <<<"$runs" | head -1)"
            if [[ -n "$run_id" ]]; then
              status="$(jq -r --argjson id "$run_id" '.workflow_runs[] | select(.id == $id) | .status' <<<"$runs")"
              conclusion="$(jq -r --argjson id "$run_id" '.workflow_runs[] | select(.id == $id) | .conclusion' <<<"$runs")"
              [[ "$status" != completed ]] || { [[ "$conclusion" == success ]] || exit 1; break; }
            fi
            sleep 10
          done
          test "$status" = completed
          test "$conclusion" = success
