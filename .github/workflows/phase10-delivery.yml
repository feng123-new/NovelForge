name: Phase 10 post-merge cleanup
on:
  push:
    branches: [ops/phase10-delivery]
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify merge, archive, prune only two exact delivery refs
        env:
          GH_TOKEN: ${{ github.token }}
        run: python .phase10/cleanup.py
