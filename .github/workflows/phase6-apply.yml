name: Temporary validated Phase 6 implementation

on:
  push:
    branches:
      - ops/phase6-apply

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Build Narrative Ledger implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -B feature/phase-06-narrative-ledger
          rm -f tmp2.txt
          mkdir -p internal/narrativeledger internal/server web/src/components web/src/lib docs

          cat > internal/narrativeledger/types.go <<'EOF'
          package narrativeledger

          import (
          	"errors"
          	"fmt"
          	"time"
          )

          type EventKind string

          const (
          	KindChapterFinalized        EventKind = "chapter.finalized"
          	KindSceneRecorded           EventKind = "scene.recorded"
          	KindBeatRecorded            EventKind = "beat.recorded"
          	KindThreadOpened            EventKind = "thread.opened"
          	KindThreadAdvanced          EventKind = "thread.advanced"
          	KindThreadResolved          EventKind = "thread.resolved"
          	KindThreadAbandoned         EventKind = "thread.abandoned"
          	KindPromiseMade             EventKind = "promise.made"
          	KindPromisePaid             EventKind = "promise.paid"
          	KindPromiseBroken           EventKind = "promise.broken"
          	KindQuestionOpened          EventKind = "question.opened"
          	KindQuestionAnswered        EventKind = "question.answered"
          	KindCharacterArcAdvanced    EventKind = "character_arc.advanced"
          	KindRelationshipArcAdvanced EventKind = "relationship_arc.advanced"
          	KindTensionSet              EventKind = "tension.set"
          	KindNoteRecorded            EventKind = "note.recorded"
          )

          var (
          	ErrInvalid             = errors.New("invalid narrative ledger request")
          	ErrIdempotencyConflict = errors.New("narrative ledger idempotency conflict")
          	ErrRevisionConflict    = errors.New("narrative ledger revision conflict")
          	ErrSemanticConflict    = errors.New("narrative ledger semantic conflict")
          	ErrIntegrity           = errors.New("narrative ledger integrity failure")
          )

          type ValidationError struct{ Message string }

          func (e *ValidationError) Error() string { return e.Message }
          func (e *ValidationError) Unwrap() error { return ErrInvalid }

          type ConflictError struct {
          	Kind     error
          	Message  string
          	Expected int64
          	Actual   int64
          }

          func (e *ConflictError) Error() string {
          	if e.Expected != 0 || e.Actual != 0 {
          		return fmt.Sprintf("%s (expected=%d actual=%d)", e.Message, e.Expected, e.Actual)
          	}
          	return e.Message
          }
          func (e *ConflictError) Unwrap() error { return e.Kind }

          type SourceRef struct {
          	Type string `json:"type"`
          	ID   string `json:"id"`
          }

          type EventInput struct {
          	EventID  string         `json:"event_id,omitempty"`
          	Kind     EventKind      `json:"kind"`
          	Chapter  int            `json:"chapter,omitempty"`
          	Sequence int            `json:"sequence,omitempty"`
          	Subject  string         `json:"subject,omitempty"`
          	ThreadID string         `json:"thread_id,omitempty"`
          	Payload  map[string]any `json:"payload,omitempty"`
          	Tags     []string       `json:"tags,omitempty"`
          	Source   SourceRef      `json:"source"`
          }

          type Event struct {
          	EventInput
          	ProjectID      string    `json:"project_id"`
          	Revision       int64     `json:"revision"`
          	PreviousHash   string    `json:"previous_hash,omitempty"`
          	Hash           string    `json:"hash"`
          	RequestHash    string    `json:"request_hash"`
          	IdempotencyKey string    `json:"idempotency_key"`
          	CreatedAt      time.Time `json:"created_at"`
          }

          type CommitRequest struct {
          	ProjectID       string       `json:"project_id"`
          	IdempotencyKey  string       `json:"idempotency_key"`
          	ExpectedRevision *int64      `json:"expected_revision,omitempty"`
          	Events          []EventInput `json:"events"`
          }

          type Receipt struct {
          	ProjectID       string   `json:"project_id"`
          	IdempotencyKey  string   `json:"idempotency_key"`
          	RequestHash     string   `json:"request_hash"`
          	FromRevision    int64    `json:"from_revision"`
          	ToRevision      int64    `json:"to_revision"`
          	HeadHash        string   `json:"head_hash"`
          	EventIDs        []string `json:"event_ids"`
          }

          type Query struct {
          	ProjectID     string
          	AfterRevision int64
          	BeforeRevision int64
          	Chapter       int
          	Kinds         []EventKind
          	Limit         int
          }

          type ThreadState struct {
          	ID             string `json:"id"`
          	Title          string `json:"title,omitempty"`
          	Status         string `json:"status"`
          	OpenedChapter  int    `json:"opened_chapter"`
          	UpdatedChapter int    `json:"updated_chapter"`
          	Resolution     string `json:"resolution,omitempty"`
          }

          type PromiseState struct {
          	ID             string `json:"id"`
          	Description    string `json:"description,omitempty"`
          	Status         string `json:"status"`
          	MadeChapter    int    `json:"made_chapter"`
          	UpdatedChapter int    `json:"updated_chapter"`
          	Outcome        string `json:"outcome,omitempty"`
          }

          type QuestionState struct {
          	ID              string `json:"id"`
          	Question        string `json:"question,omitempty"`
          	Status          string `json:"status"`
          	OpenedChapter   int    `json:"opened_chapter"`
          	UpdatedChapter  int    `json:"updated_chapter"`
          	Answer          string `json:"answer,omitempty"`
          }

          type ArcState struct {
          	ID             string `json:"id"`
          	Kind           string `json:"kind"`
          	Status         string `json:"status,omitempty"`
          	Summary        string `json:"summary,omitempty"`
          	Step           int    `json:"step"`
          	UpdatedChapter int    `json:"updated_chapter"`
          }

          type SceneRecord struct {
          	EventID  string `json:"event_id"`
          	Chapter  int    `json:"chapter"`
          	Sequence int    `json:"sequence"`
          	Title    string `json:"title,omitempty"`
          	Summary  string `json:"summary,omitempty"`
          }

          type BeatRecord struct {
          	EventID  string `json:"event_id"`
          	Chapter  int    `json:"chapter"`
          	Sequence int    `json:"sequence"`
          	Summary  string `json:"summary,omitempty"`
          }

          type State struct {
          	ProjectID            string                  `json:"project_id"`
          	Revision             int64                   `json:"revision"`
          	HeadHash             string                  `json:"head_hash,omitempty"`
          	LastFinalizedChapter int                     `json:"last_finalized_chapter"`
          	Tension              float64                 `json:"tension"`
          	Threads              map[string]ThreadState  `json:"threads"`
          	Promises             map[string]PromiseState `json:"promises"`
          	Questions            map[string]QuestionState `json:"questions"`
          	CharacterArcs        map[string]ArcState     `json:"character_arcs"`
          	RelationshipArcs     map[string]ArcState     `json:"relationship_arcs"`
          	Scenes               []SceneRecord           `json:"scenes"`
          	Beats                []BeatRecord            `json:"beats"`
          }

          type AuditReport struct {
          	ProjectID      string   `json:"project_id"`
          	Valid          bool     `json:"valid"`
          	Revision       int64    `json:"revision"`
          	HeadHash       string   `json:"head_hash,omitempty"`
          	CheckedEvents  int      `json:"checked_events"`
          	Errors         []string `json:"errors,omitempty"`
          }
          EOF

          cat > internal/narrativeledger/repository.go <<'EOF'
          package narrativeledger

          import (
          	"bufio"
          	"bytes"
          	"context"
          	"crypto/sha256"
          	"encoding/hex"
          	"encoding/json"
          	"errors"
          	"fmt"
          	"io"
          	"os"
          	"path/filepath"
          	"regexp"
          	"runtime"
          	"sort"
          	"strconv"
          	"strings"
          	"sync"
          	"time"
          )

          const (
          	documentVersion    = 1
          	maxBatchEvents     = 128
          	maxPayloadBytes    = 64 << 10
          	maxDocumentBytes   = 64 << 20
          	maxTags            = 32
          	defaultQueryLimit  = 100
          	maxQueryLimit      = 500
          )

          var identifierPattern = regexp.MustCompile(`^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$`)

          var allowedKinds = map[EventKind]struct{}{
          	KindChapterFinalized: {}, KindSceneRecorded: {}, KindBeatRecorded: {},
          	KindThreadOpened: {}, KindThreadAdvanced: {}, KindThreadResolved: {}, KindThreadAbandoned: {},
          	KindPromiseMade: {}, KindPromisePaid: {}, KindPromiseBroken: {},
          	KindQuestionOpened: {}, KindQuestionAnswered: {},
          	KindCharacterArcAdvanced: {}, KindRelationshipArcAdvanced: {},
          	KindTensionSet: {}, KindNoteRecorded: {},
          }

          type Repository interface {
          	Commit(context.Context, CommitRequest) (Receipt, error)
          	StateAt(context.Context, string, int64, int) (State, error)
          	List(context.Context, Query) ([]Event, error)
          	Audit(context.Context, string) (AuditReport, error)
          }

          type idempotencyRecord struct {
          	RequestHash string  `json:"request_hash"`
          	Receipt     Receipt `json:"receipt"`
          }

          type diskDocument struct {
          	Version     int                          `json:"version"`
          	ProjectID   string                       `json:"project_id"`
          	Revision    int64                        `json:"revision"`
          	HeadHash    string                       `json:"head_hash,omitempty"`
          	Events      []Event                      `json:"events"`
          	Idempotency map[string]idempotencyRecord `json:"idempotency"`
          }

          type FileRepository struct {
          	root  string
          	now   func() time.Time
          	locks sync.Map
          }

          func NewFileRepository(root string) (*FileRepository, error) {
          	root = strings.TrimSpace(root)
          	if root == "" {
          		return nil, invalid("repository root is required")
          	}
          	if err := os.MkdirAll(root, 0o700); err != nil {
          		return nil, fmt.Errorf("create narrative ledger root: %w", err)
          	}
          	return &FileRepository{root: root, now: time.Now}, nil
          }

          func (r *FileRepository) projectLock(projectID string) *sync.Mutex {
          	value, _ := r.locks.LoadOrStore(projectID, &sync.Mutex{})
          	return value.(*sync.Mutex)
          }

          func (r *FileRepository) Commit(ctx context.Context, request CommitRequest) (Receipt, error) {
          	if err := ctx.Err(); err != nil { return Receipt{}, err }
          	normalized, requestHash, err := normalizeRequest(request)
          	if err != nil { return Receipt{}, err }
          	lock := r.projectLock(normalized.ProjectID)
          	lock.Lock()
          	defer lock.Unlock()

          	doc, err := r.load(normalized.ProjectID)
          	if err != nil { return Receipt{}, err }
          	if record, ok := doc.Idempotency[normalized.IdempotencyKey]; ok {
          		if record.RequestHash != requestHash {
          			return Receipt{}, &ConflictError{Kind: ErrIdempotencyConflict, Message: "idempotency key was already used with different content"}
          		}
          		return cloneReceipt(record.Receipt), nil
          	}
          	if normalized.ExpectedRevision != nil && *normalized.ExpectedRevision != doc.Revision {
          		return Receipt{}, &ConflictError{Kind: ErrRevisionConflict, Message: "ledger revision does not match", Expected: *normalized.ExpectedRevision, Actual: doc.Revision}
          	}

          	createdAt := r.now().UTC()
          	if createdAt.IsZero() { createdAt = time.Now().UTC() }
          	from := doc.Revision + 1
          	previous := doc.HeadHash
          	newEvents := make([]Event, 0, len(normalized.Events))
          	eventIDs := make([]string, 0, len(normalized.Events))
          	for index, input := range normalized.Events {
          		if input.EventID == "" { input.EventID = generatedEventID(requestHash, index) }
          		revision := doc.Revision + int64(index) + 1
          		event := Event{EventInput: input, ProjectID: normalized.ProjectID, Revision: revision, PreviousHash: previous, RequestHash: requestHash, IdempotencyKey: normalized.IdempotencyKey, CreatedAt: createdAt}
          		event.Hash, err = eventHash(event)
          		if err != nil { return Receipt{}, err }
          		previous = event.Hash
          		newEvents = append(newEvents, event)
          		eventIDs = append(eventIDs, event.EventID)
          	}

          	candidate := append(append([]Event(nil), doc.Events...), newEvents...)
          	if _, err := project(normalized.ProjectID, candidate, 0, 0); err != nil { return Receipt{}, err }
          	doc.Events = candidate
          	doc.Revision += int64(len(newEvents))
          	doc.HeadHash = previous
          	receipt := Receipt{ProjectID: normalized.ProjectID, IdempotencyKey: normalized.IdempotencyKey, RequestHash: requestHash, FromRevision: from, ToRevision: doc.Revision, HeadHash: doc.HeadHash, EventIDs: eventIDs}
          	doc.Idempotency[normalized.IdempotencyKey] = idempotencyRecord{RequestHash: requestHash, Receipt: receipt}
          	if err := ctx.Err(); err != nil { return Receipt{}, err }
          	if err := r.store(doc); err != nil { return Receipt{}, err }
          	return cloneReceipt(receipt), nil
          }

          func (r *FileRepository) StateAt(ctx context.Context, projectID string, atRevision int64, chapter int) (State, error) {
          	if err := ctx.Err(); err != nil { return State{}, err }
          	projectID = strings.TrimSpace(projectID)
          	if err := validateProjectID(projectID); err != nil { return State{}, err }
          	lock := r.projectLock(projectID)
          	lock.Lock(); defer lock.Unlock()
          	doc, err := r.load(projectID)
          	if err != nil { return State{}, err }
          	return project(projectID, doc.Events, atRevision, chapter)
          }

          func (r *FileRepository) List(ctx context.Context, query Query) ([]Event, error) {
          	if err := ctx.Err(); err != nil { return nil, err }
          	query.ProjectID = strings.TrimSpace(query.ProjectID)
          	if err := validateProjectID(query.ProjectID); err != nil { return nil, err }
          	if query.AfterRevision < 0 || query.BeforeRevision < 0 || query.Chapter < 0 { return nil, invalid("query bounds cannot be negative") }
          	if query.Limit == 0 { query.Limit = defaultQueryLimit }
          	if query.Limit < 1 || query.Limit > maxQueryLimit { return nil, invalid("limit must be between 1 and 500") }
          	kinds := make(map[EventKind]struct{}, len(query.Kinds))
          	for _, kind := range query.Kinds {
          		if _, ok := allowedKinds[kind]; !ok { return nil, invalid("unsupported event kind %q", kind) }
          		kinds[kind] = struct{}{}
          	}
          	lock := r.projectLock(query.ProjectID)
          	lock.Lock(); defer lock.Unlock()
          	doc, err := r.load(query.ProjectID)
          	if err != nil { return nil, err }
          	result := make([]Event, 0, min(query.Limit, len(doc.Events)))
          	for _, event := range doc.Events {
          		if event.Revision <= query.AfterRevision { continue }
          		if query.BeforeRevision > 0 && event.Revision > query.BeforeRevision { continue }
          		if query.Chapter > 0 && event.Chapter != query.Chapter { continue }
          		if len(kinds) > 0 { if _, ok := kinds[event.Kind]; !ok { continue } }
          		result = append(result, cloneEvent(event))
          		if len(result) == query.Limit { break }
          	}
          	return result, nil
          }

          func (r *FileRepository) Audit(ctx context.Context, projectID string) (AuditReport, error) {
          	if err := ctx.Err(); err != nil { return AuditReport{}, err }
          	projectID = strings.TrimSpace(projectID)
          	if err := validateProjectID(projectID); err != nil { return AuditReport{}, err }
          	lock := r.projectLock(projectID)
          	lock.Lock(); defer lock.Unlock()
          	doc, err := r.load(projectID)
          	if err != nil {
          		return AuditReport{ProjectID: projectID, Valid: false, Errors: []string{err.Error()}}, nil
          	}
          	report := AuditReport{ProjectID: projectID, Valid: true, Revision: doc.Revision, HeadHash: doc.HeadHash, CheckedEvents: len(doc.Events)}
          	previous := ""
          	for index, event := range doc.Events {
          		expectedRevision := int64(index + 1)
          		if event.ProjectID != projectID { report.Errors = append(report.Errors, fmt.Sprintf("revision %d project mismatch", expectedRevision)) }
          		if event.Revision != expectedRevision { report.Errors = append(report.Errors, fmt.Sprintf("revision sequence mismatch at %d", expectedRevision)) }
          		if event.PreviousHash != previous { report.Errors = append(report.Errors, fmt.Sprintf("previous hash mismatch at revision %d", expectedRevision)) }
          		hash, hashErr := eventHash(event)
          		if hashErr != nil || hash != event.Hash { report.Errors = append(report.Errors, fmt.Sprintf("event hash mismatch at revision %d", expectedRevision)) }
          		previous = event.Hash
          	}
          	if doc.Revision != int64(len(doc.Events)) { report.Errors = append(report.Errors, "document revision does not match event count") }
          	if doc.HeadHash != previous { report.Errors = append(report.Errors, "document head hash does not match event chain") }
          	if _, projectionErr := project(projectID, doc.Events, 0, 0); projectionErr != nil { report.Errors = append(report.Errors, projectionErr.Error()) }
          	report.Valid = len(report.Errors) == 0
          	return report, nil
          }

          func (r *FileRepository) load(projectID string) (diskDocument, error) {
          	path := r.path(projectID)
          	file, err := os.Open(path)
          	if errors.Is(err, os.ErrNotExist) {
          		return diskDocument{Version: documentVersion, ProjectID: projectID, Idempotency: map[string]idempotencyRecord{}}, nil
          	}
          	if err != nil { return diskDocument{}, fmt.Errorf("open narrative ledger: %w", err) }
          	defer file.Close()
          	decoder := json.NewDecoder(io.LimitReader(file, maxDocumentBytes+1))
          	decoder.DisallowUnknownFields()
          	var doc diskDocument
          	if err := decoder.Decode(&doc); err != nil { return diskDocument{}, fmt.Errorf("decode narrative ledger: %w", err) }
          	if err := ensureJSONEOF(decoder); err != nil { return diskDocument{}, fmt.Errorf("decode narrative ledger: %w", err) }
          	if doc.Version != documentVersion || doc.ProjectID != projectID { return diskDocument{}, fmt.Errorf("%w: narrative ledger metadata mismatch", ErrIntegrity) }
          	if doc.Idempotency == nil { doc.Idempotency = map[string]idempotencyRecord{} }
          	return doc, nil
          }

          func (r *FileRepository) store(doc diskDocument) error {
          	if err := os.MkdirAll(r.root, 0o700); err != nil { return fmt.Errorf("create narrative ledger root: %w", err) }
          	target := r.path(doc.ProjectID)
          	temp, err := os.CreateTemp(r.root, ".narrative-ledger-*.tmp")
          	if err != nil { return fmt.Errorf("create narrative ledger temp file: %w", err) }
          	tempName := temp.Name()
          	committed := false
          	defer func() { if !committed { _ = temp.Close(); _ = os.Remove(tempName) } }()
          	writer := bufio.NewWriter(temp)
          	encoder := json.NewEncoder(writer)
          	encoder.SetEscapeHTML(false)
          	if err := encoder.Encode(doc); err != nil { return fmt.Errorf("encode narrative ledger: %w", err) }
          	if err := writer.Flush(); err != nil { return fmt.Errorf("flush narrative ledger: %w", err) }
          	if err := temp.Sync(); err != nil { return fmt.Errorf("sync narrative ledger: %w", err) }
          	if err := temp.Close(); err != nil { return fmt.Errorf("close narrative ledger: %w", err) }
          	if err := os.Chmod(tempName, 0o600); err != nil { return fmt.Errorf("secure narrative ledger: %w", err) }

          	backup := target + ".bak"
          	_ = os.Remove(backup)
          	hadTarget := false
          	if _, err := os.Stat(target); err == nil {
          		hadTarget = true
          		if err := os.Rename(target, backup); err != nil { return fmt.Errorf("backup narrative ledger: %w", err) }
          	} else if !errors.Is(err, os.ErrNotExist) { return fmt.Errorf("stat narrative ledger: %w", err) }
          	if err := os.Rename(tempName, target); err != nil {
          		if hadTarget { _ = os.Rename(backup, target) }
          		return fmt.Errorf("replace narrative ledger: %w", err)
          	}
          	committed = true
          	_ = os.Remove(backup)
          	if runtime.GOOS != "windows" {
          		if directory, err := os.Open(r.root); err == nil { _ = directory.Sync(); _ = directory.Close() }
          	}
          	return nil
          }

          func (r *FileRepository) path(projectID string) string {
          	sum := sha256.Sum256([]byte(projectID))
          	return filepath.Join(r.root, hex.EncodeToString(sum[:])+".json")
          }

          func normalizeRequest(request CommitRequest) (CommitRequest, string, error) {
          	request.ProjectID = strings.TrimSpace(request.ProjectID)
          	request.IdempotencyKey = strings.TrimSpace(request.IdempotencyKey)
          	if err := validateProjectID(request.ProjectID); err != nil { return CommitRequest{}, "", err }
          	if request.IdempotencyKey == "" || len(request.IdempotencyKey) > 200 { return CommitRequest{}, "", invalid("idempotency key is required and must not exceed 200 characters") }
          	if len(request.Events) == 0 || len(request.Events) > maxBatchEvents { return CommitRequest{}, "", invalid("events must contain between 1 and 128 entries") }
          	seen := make(map[string]struct{}, len(request.Events))
          	for index := range request.Events {
          		input := &request.Events[index]
          		input.EventID = strings.TrimSpace(input.EventID)
          		input.Subject = strings.TrimSpace(input.Subject)
          		input.ThreadID = strings.TrimSpace(input.ThreadID)
          		input.Source.Type = strings.TrimSpace(input.Source.Type)
          		input.Source.ID = strings.TrimSpace(input.Source.ID)
          		if _, ok := allowedKinds[input.Kind]; !ok { return CommitRequest{}, "", invalid("unsupported event kind %q", input.Kind) }
          		if input.Chapter < 0 || input.Sequence < 0 { return CommitRequest{}, "", invalid("chapter and sequence cannot be negative") }
          		for _, pair := range []struct{name, value string}{{"event_id", input.EventID}, {"subject", input.Subject}, {"thread_id", input.ThreadID}} {
          			if pair.value != "" && !identifierPattern.MatchString(pair.value) { return CommitRequest{}, "", invalid("%s contains unsupported characters", pair.name) }
          		}
          		if input.EventID != "" { if _, duplicate := seen[input.EventID]; duplicate { return CommitRequest{}, "", invalid("event_id %q is duplicated in the batch", input.EventID) }; seen[input.EventID] = struct{}{} }
          		if input.Source.Type == "" || input.Source.ID == "" || len(input.Source.Type) > 64 || len(input.Source.ID) > 256 { return CommitRequest{}, "", invalid("source type and id are required and bounded") }
          		if len(input.Tags) > maxTags { return CommitRequest{}, "", invalid("an event cannot contain more than 32 tags") }
          		for tagIndex, tag := range input.Tags { input.Tags[tagIndex] = strings.TrimSpace(tag); if input.Tags[tagIndex] == "" || len(input.Tags[tagIndex]) > 64 { return CommitRequest{}, "", invalid("tags must be non-empty and at most 64 characters") } }
          		if input.Payload == nil { input.Payload = map[string]any{} }
          		payload, err := json.Marshal(input.Payload); if err != nil { return CommitRequest{}, "", invalid("payload must be valid JSON: %v", err) }
          		if len(payload) > maxPayloadBytes { return CommitRequest{}, "", invalid("payload exceeds 64 KiB") }
          		if err := validateKind(*input); err != nil { return CommitRequest{}, "", err }
          	}
          	hashRequest := request
          	hashRequest.IdempotencyKey = ""
          	encoded, err := json.Marshal(hashRequest)
          	if err != nil { return CommitRequest{}, "", fmt.Errorf("hash narrative ledger request: %w", err) }
          	sum := sha256.Sum256(encoded)
          	return request, hex.EncodeToString(sum[:]), nil
          }

          func validateKind(input EventInput) error {
          	logical := input.ThreadID; if logical == "" { logical = input.Subject }
          	switch input.Kind {
          	case KindChapterFinalized:
          		if input.Chapter < 1 { return invalid("chapter.finalized requires a positive chapter") }
          	case KindThreadOpened, KindThreadAdvanced, KindThreadResolved, KindThreadAbandoned:
          		if logical == "" { return invalid("thread events require thread_id or subject") }
          	case KindPromiseMade, KindPromisePaid, KindPromiseBroken, KindQuestionOpened, KindQuestionAnswered, KindCharacterArcAdvanced, KindRelationshipArcAdvanced:
          		if input.Subject == "" { return invalid("%s requires subject", input.Kind) }
          	case KindTensionSet:
          		level, ok := number(input.Payload["level"]); if !ok || level < 0 || level > 10 { return invalid("tension.set requires payload.level between 0 and 10") }
          	}
          	return nil
          }

          func validateProjectID(projectID string) error {
          	if projectID == "" || len(projectID) > 200 { return invalid("project id is required and must not exceed 200 characters") }
          	for _, r := range projectID { if r < 0x20 || r == '/' || r == '\\' { return invalid("project id contains unsupported characters") } }
          	return nil
          }

          func project(projectID string, events []Event, atRevision int64, chapter int) (State, error) {
          	state := State{ProjectID: projectID, Threads: map[string]ThreadState{}, Promises: map[string]PromiseState{}, Questions: map[string]QuestionState{}, CharacterArcs: map[string]ArcState{}, RelationshipArcs: map[string]ArcState{}, Scenes: []SceneRecord{}, Beats: []BeatRecord{}}
          	for _, event := range events {
          		if atRevision > 0 && event.Revision > atRevision { break }
          		if chapter > 0 && event.Chapter > chapter { continue }
          		if err := apply(&state, event); err != nil { return State{}, err }
          		state.Revision = event.Revision
          		state.HeadHash = event.Hash
          	}
          	return state, nil
          }

          func apply(state *State, event Event) error {
          	logical := event.ThreadID; if logical == "" { logical = event.Subject }
          	switch event.Kind {
          	case KindChapterFinalized:
          		if event.Chapter <= state.LastFinalizedChapter { return semantic("chapter %d cannot be finalized after chapter %d", event.Chapter, state.LastFinalizedChapter) }
          		state.LastFinalizedChapter = event.Chapter
          	case KindThreadOpened:
          		if _, exists := state.Threads[logical]; exists { return semantic("thread %q already exists", logical) }
          		state.Threads[logical] = ThreadState{ID: logical, Title: text(event.Payload, "title", event.Subject), Status: "open", OpenedChapter: event.Chapter, UpdatedChapter: event.Chapter}
          	case KindThreadAdvanced:
          		value, exists := state.Threads[logical]; if !exists || value.Status != "open" { return semantic("thread %q is not open", logical) }
          		value.UpdatedChapter = event.Chapter; if title := text(event.Payload, "title", ""); title != "" { value.Title = title }; state.Threads[logical] = value
          	case KindThreadResolved, KindThreadAbandoned:
          		value, exists := state.Threads[logical]; if !exists || value.Status != "open" { return semantic("thread %q is not open", logical) }
          		if event.Kind == KindThreadResolved { value.Status = "resolved" } else { value.Status = "abandoned" }
          		value.Resolution = text(event.Payload, "resolution", ""); value.UpdatedChapter = event.Chapter; state.Threads[logical] = value
          	case KindPromiseMade:
          		if _, exists := state.Promises[event.Subject]; exists { return semantic("promise %q already exists", event.Subject) }
          		state.Promises[event.Subject] = PromiseState{ID: event.Subject, Description: text(event.Payload, "description", ""), Status: "open", MadeChapter: event.Chapter, UpdatedChapter: event.Chapter}
          	case KindPromisePaid, KindPromiseBroken:
          		value, exists := state.Promises[event.Subject]; if !exists || value.Status != "open" { return semantic("promise %q is not open", event.Subject) }
          		if event.Kind == KindPromisePaid { value.Status = "paid" } else { value.Status = "broken" }
          		value.Outcome = text(event.Payload, "outcome", ""); value.UpdatedChapter = event.Chapter; state.Promises[event.Subject] = value
          	case KindQuestionOpened:
          		if _, exists := state.Questions[event.Subject]; exists { return semantic("question %q already exists", event.Subject) }
          		state.Questions[event.Subject] = QuestionState{ID: event.Subject, Question: text(event.Payload, "question", ""), Status: "open", OpenedChapter: event.Chapter, UpdatedChapter: event.Chapter}
          	case KindQuestionAnswered:
          		value, exists := state.Questions[event.Subject]; if !exists || value.Status != "open" { return semantic("question %q is not open", event.Subject) }
          		value.Status = "answered"; value.Answer = text(event.Payload, "answer", ""); value.UpdatedChapter = event.Chapter; state.Questions[event.Subject] = value
          	case KindCharacterArcAdvanced, KindRelationshipArcAdvanced:
          		target := state.CharacterArcs; kind := "character"; if event.Kind == KindRelationshipArcAdvanced { target = state.RelationshipArcs; kind = "relationship" }
          		value := target[event.Subject]; value.ID = event.Subject; value.Kind = kind; value.Step++; value.UpdatedChapter = event.Chapter
          		value.Status = text(event.Payload, "status", value.Status); value.Summary = text(event.Payload, "summary", value.Summary); target[event.Subject] = value
          	case KindSceneRecorded:
          		state.Scenes = append(state.Scenes, SceneRecord{EventID: event.EventID, Chapter: event.Chapter, Sequence: event.Sequence, Title: text(event.Payload, "title", event.Subject), Summary: text(event.Payload, "summary", "")})
          	case KindBeatRecorded:
          		state.Beats = append(state.Beats, BeatRecord{EventID: event.EventID, Chapter: event.Chapter, Sequence: event.Sequence, Summary: text(event.Payload, "summary", event.Subject)})
          	case KindTensionSet:
          		state.Tension, _ = number(event.Payload["level"])
          	case KindNoteRecorded:
          	default:
          		return semantic("unsupported event kind %q", event.Kind)
          	}
          	return nil
          }

          func eventHash(event Event) (string, error) {
          	canonical := struct {
          		ProjectID string `json:"project_id"`; Revision int64 `json:"revision"`; PreviousHash string `json:"previous_hash"`; Input EventInput `json:"input"`; RequestHash string `json:"request_hash"`; IdempotencyKey string `json:"idempotency_key"`; CreatedAt string `json:"created_at"`
          	}{event.ProjectID, event.Revision, event.PreviousHash, event.EventInput, event.RequestHash, event.IdempotencyKey, event.CreatedAt.UTC().Format(time.RFC3339Nano)}
          	encoded, err := json.Marshal(canonical); if err != nil { return "", fmt.Errorf("hash narrative ledger event: %w", err) }
          	sum := sha256.Sum256(encoded); return hex.EncodeToString(sum[:]), nil
          }

          func generatedEventID(requestHash string, index int) string { return "evt-" + requestHash[:20] + "-" + strconv.Itoa(index+1) }
          func invalid(format string, values ...any) error { return &ValidationError{Message: fmt.Sprintf(format, values...)} }
          func semantic(format string, values ...any) error { return &ConflictError{Kind: ErrSemanticConflict, Message: fmt.Sprintf(format, values...)} }
          func text(payload map[string]any, key, fallback string) string { if value, ok := payload[key].(string); ok && strings.TrimSpace(value) != "" { return strings.TrimSpace(value) }; return fallback }
          func number(value any) (float64, bool) { switch value := value.(type) { case float64: return value, true; case float32: return float64(value), true; case int: return float64(value), true; case int64: return float64(value), true; case json.Number: parsed, err := value.Float64(); return parsed, err == nil; default: return 0, false } }
          func ensureJSONEOF(decoder *json.Decoder) error { var trailing any; if err := decoder.Decode(&trailing); errors.Is(err, io.EOF) { return nil } else if err != nil { return err }; return errors.New("multiple JSON values are not allowed") }
          func cloneReceipt(value Receipt) Receipt { value.EventIDs = append([]string(nil), value.EventIDs...); return value }
          func cloneEvent(value Event) Event { encoded, _ := json.Marshal(value); var result Event; _ = json.Unmarshal(encoded, &result); return result }

          func SortStateForDisplay(state *State) {
          	sort.SliceStable(state.Scenes, func(i, j int) bool { if state.Scenes[i].Chapter != state.Scenes[j].Chapter { return state.Scenes[i].Chapter < state.Scenes[j].Chapter }; return state.Scenes[i].Sequence < state.Scenes[j].Sequence })
          	sort.SliceStable(state.Beats, func(i, j int) bool { if state.Beats[i].Chapter != state.Beats[j].Chapter { return state.Beats[i].Chapter < state.Beats[j].Chapter }; return state.Beats[i].Sequence < state.Beats[j].Sequence })
          }

