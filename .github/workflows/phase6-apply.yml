          package server

          import (
          	"bytes"
          	"context"
          	"crypto/sha256"
          	"encoding/hex"
          	"encoding/json"
          	"errors"
          	"fmt"
          	"io"
          	"net/http"
          	"os"
          	"path/filepath"
          	"strconv"
          	"strings"
          	"sync"
          	"time"

          	"__MODULE__/internal/narrativeledger"
          )

          const narrativeBodyLimit = 1 << 20

          var narrativeRuntime struct {
          	sync.Mutex
          	repository narrativeledger.Repository
          	err error
          }

          func narrativeRepository() (narrativeledger.Repository, error) {
          	narrativeRuntime.Lock(); defer narrativeRuntime.Unlock()
          	if narrativeRuntime.repository != nil || narrativeRuntime.err != nil { return narrativeRuntime.repository, narrativeRuntime.err }
          	root := strings.TrimSpace(os.Getenv("NOVELFORGE_NARRATIVE_LEDGER_DIR"))
          	if root == "" {
          		config, err := os.UserConfigDir(); if err != nil { narrativeRuntime.err = fmt.Errorf("resolve narrative ledger directory: %w", err); return nil, narrativeRuntime.err }
          		root = filepath.Join(config, "NovelForge", "narrative-ledger")
          	}
          	narrativeRuntime.repository, narrativeRuntime.err = narrativeledger.NewFileRepository(root)
          	return narrativeRuntime.repository, narrativeRuntime.err
          }

          func setNarrativeRepositoryForTest(repository narrativeledger.Repository) func() {
          	narrativeRuntime.Lock(); previous, previousErr := narrativeRuntime.repository, narrativeRuntime.err; narrativeRuntime.repository, narrativeRuntime.err = repository, nil; narrativeRuntime.Unlock()
          	return func() { narrativeRuntime.Lock(); narrativeRuntime.repository, narrativeRuntime.err = previous, previousErr; narrativeRuntime.Unlock() }
          }

          type narrativeCommitBody struct {
          	ExpectedRevision *int64                       `json:"expected_revision,omitempty"`
          	Events           []narrativeledger.EventInput `json:"events"`
          }

          func (s *__SERVER_TYPE__) handleNarrativeCommit(w http.ResponseWriter, r *http.Request) {
          	projectID := strings.TrimSpace(r.PathValue("id"))
          	key := strings.TrimSpace(r.Header.Get("Idempotency-Key"))
          	if key == "" { writeNarrativeError(w, r, http.StatusBadRequest, "missing_idempotency_key", "Idempotency-Key is required"); return }
          	var body narrativeCommitBody
          	if err := decodeNarrativeJSON(w, r, &body); err != nil { writeNarrativeError(w, r, http.StatusBadRequest, "invalid_json", err.Error()); return }
          	repository, err := narrativeRepository(); if err != nil { writeNarrativeError(w, r, http.StatusInternalServerError, "narrative_storage_unavailable", "Narrative Ledger is unavailable"); return }
          	receipt, err := repository.Commit(r.Context(), narrativeledger.CommitRequest{ProjectID: projectID, IdempotencyKey: key, ExpectedRevision: body.ExpectedRevision, Events: body.Events})
          	if err != nil { writeNarrativeRepositoryError(w, r, err); return }
          	w.Header().Set("X-Narrative-Ledger-Revision", strconv.FormatInt(receipt.ToRevision, 10))
          	writeNarrativeJSON(w, r, http.StatusOK, receipt)
          }

          func (s *__SERVER_TYPE__) handleNarrativeState(w http.ResponseWriter, r *http.Request) {
          	revision, err := narrativeIntQuery(r, "revision", 0, 1<<62); if err != nil { writeNarrativeError(w, r, http.StatusBadRequest, "invalid_query", err.Error()); return }
          	chapter, err := narrativeIntQuery(r, "chapter", 0, 1<<30); if err != nil { writeNarrativeError(w, r, http.StatusBadRequest, "invalid_query", err.Error()); return }
          	repository, err := narrativeRepository(); if err != nil { writeNarrativeError(w, r, http.StatusInternalServerError, "narrative_storage_unavailable", "Narrative Ledger is unavailable"); return }
          	state, err := repository.StateAt(r.Context(), strings.TrimSpace(r.PathValue("id")), int64(revision), chapter); if err != nil { writeNarrativeRepositoryError(w, r, err); return }
          	narrativeledger.SortStateForDisplay(&state)
          	writeNarrativeJSON(w, r, http.StatusOK, state)
          }

          func (s *__SERVER_TYPE__) handleNarrativeEvents(w http.ResponseWriter, r *http.Request) {
          	after, err := narrativeIntQuery(r, "after_revision", 0, 1<<62); if err != nil { writeNarrativeError(w, r, http.StatusBadRequest, "invalid_query", err.Error()); return }
          	before, err := narrativeIntQuery(r, "before_revision", 0, 1<<62); if err != nil { writeNarrativeError(w, r, http.StatusBadRequest, "invalid_query", err.Error()); return }
          	chapter, err := narrativeIntQuery(r, "chapter", 0, 1<<30); if err != nil { writeNarrativeError(w, r, http.StatusBadRequest, "invalid_query", err.Error()); return }
          	limit, err := narrativeIntQuery(r, "limit", 100, 500); if err != nil { writeNarrativeError(w, r, http.StatusBadRequest, "invalid_query", err.Error()); return }
          	var kinds []narrativeledger.EventKind
          	for _, raw := range r.URL.Query()["kind"] { for _, value := range strings.Split(raw, ",") { if value = strings.TrimSpace(value); value != "" { kinds = append(kinds, narrativeledger.EventKind(value)) } } }
          	repository, err := narrativeRepository(); if err != nil { writeNarrativeError(w, r, http.StatusInternalServerError, "narrative_storage_unavailable", "Narrative Ledger is unavailable"); return }
          	events, err := repository.List(r.Context(), narrativeledger.Query{ProjectID: strings.TrimSpace(r.PathValue("id")), AfterRevision: int64(after), BeforeRevision: int64(before), Chapter: chapter, Kinds: kinds, Limit: limit}); if err != nil { writeNarrativeRepositoryError(w, r, err); return }
          	writeNarrativeJSON(w, r, http.StatusOK, map[string]any{"events": events})
          }

          func (s *__SERVER_TYPE__) handleNarrativeAudit(w http.ResponseWriter, r *http.Request) {
          	repository, err := narrativeRepository(); if err != nil { writeNarrativeError(w, r, http.StatusInternalServerError, "narrative_storage_unavailable", "Narrative Ledger is unavailable"); return }
          	report, err := repository.Audit(r.Context(), strings.TrimSpace(r.PathValue("id"))); if err != nil { writeNarrativeRepositoryError(w, r, err); return }
          	status := http.StatusOK; if !report.Valid { status = http.StatusConflict }
          	writeNarrativeJSON(w, r, status, report)
          }

          func (s *__SERVER_TYPE__) wrapNarrativeFinalize(next http.HandlerFunc) http.HandlerFunc {
          	return func(w http.ResponseWriter, r *http.Request) {
          		buffer := newNarrativeResponseBuffer()
          		next(buffer, r)
          		if buffer.status < 200 || buffer.status >= 300 { buffer.flush(w); return }
          		projectID := strings.TrimSpace(r.PathValue("id")); chapter, err := strconv.Atoi(strings.TrimSpace(r.PathValue("chapter")))
          		if err != nil || chapter < 1 { writeNarrativeError(w, r, http.StatusInternalServerError, "narrative_finalize_invalid", "Finalized chapter could not be recorded"); return }
          		requestKey := strings.TrimSpace(r.Header.Get("Idempotency-Key")); if requestKey == "" { writeNarrativeError(w, r, http.StatusInternalServerError, "narrative_finalize_invalid", "Finalize idempotency key is unavailable"); return }
          		digest := sha256.Sum256(buffer.body.Bytes())
          	repository, err := narrativeRepository(); if err != nil { writeNarrativeError(w, r, http.StatusServiceUnavailable, "narrative_storage_unavailable", "Final chapter is durable but Narrative Ledger recording must be retried"); return }
          	receipt, err := repository.Commit(r.Context(), narrativeledger.CommitRequest{ProjectID: projectID, IdempotencyKey: "quality-finalize/"+requestKey, Events: []narrativeledger.EventInput{{Kind: narrativeledger.KindChapterFinalized, Chapter: chapter, Subject: fmt.Sprintf("chapter:%d", chapter), Payload: map[string]any{"response_sha256": hex.EncodeToString(digest[:])}, Source: narrativeledger.SourceRef{Type: "quality-gate-finalize", ID: requestKey}}}})
          		if err != nil { writeNarrativeRepositoryErrorWithStatus(w, r, err, http.StatusServiceUnavailable); return }
          		buffer.header.Set("X-Narrative-Ledger-Revision", strconv.FormatInt(receipt.ToRevision, 10)); buffer.flush(w)
          	}
          }

          type narrativeResponseBuffer struct { header http.Header; body bytes.Buffer; status int }
          func newNarrativeResponseBuffer() *narrativeResponseBuffer { return &narrativeResponseBuffer{header: make(http.Header), status: http.StatusOK} }
          func (b *narrativeResponseBuffer) Header() http.Header { return b.header }
          func (b *narrativeResponseBuffer) WriteHeader(status int) { if b.body.Len() == 0 && b.status == http.StatusOK { b.status = status } }
          func (b *narrativeResponseBuffer) Write(value []byte) (int, error) { return b.body.Write(value) }
          func (b *narrativeResponseBuffer) flush(w http.ResponseWriter) { for key, values := range b.header { for _, value := range values { w.Header().Add(key, value) } }; w.WriteHeader(b.status); _, _ = w.Write(b.body.Bytes()) }

          func decodeNarrativeJSON(w http.ResponseWriter, r *http.Request, destination any) error {
          	if r.Body == nil { return errors.New("request body is required") }
          	reader := http.MaxBytesReader(w, r.Body, narrativeBodyLimit)
          	decoder := json.NewDecoder(reader); decoder.DisallowUnknownFields(); decoder.UseNumber()
          	if err := decoder.Decode(destination); err != nil { return err }
          	var trailing any; if err := decoder.Decode(&trailing); !errors.Is(err, io.EOF) { if err == nil { return errors.New("multiple JSON values are not allowed") }; return err }
          	return nil
          }

          func narrativeIntQuery(r *http.Request, key string, fallback, maximum int) (int, error) {
          	raw := strings.TrimSpace(r.URL.Query().Get(key)); if raw == "" { return fallback, nil }
          	value, err := strconv.ParseInt(raw, 10, 64); if err != nil || value < 0 || value > int64(maximum) { return 0, fmt.Errorf("%s is outside the supported range", key) }
          	return int(value), nil
          }

          func writeNarrativeRepositoryError(w http.ResponseWriter, r *http.Request, err error) { writeNarrativeRepositoryErrorWithStatus(w, r, err, 0) }
          func writeNarrativeRepositoryErrorWithStatus(w http.ResponseWriter, r *http.Request, err error, override int) {
          	status, code, message := http.StatusInternalServerError, "narrative_storage_error", "Narrative Ledger operation failed"
          	switch { case errors.Is(err, narrativeledger.ErrInvalid): status, code, message = http.StatusBadRequest, "invalid_narrative_event", err.Error(); case errors.Is(err, narrativeledger.ErrIdempotencyConflict): status, code, message = http.StatusConflict, "idempotency_conflict", err.Error(); case errors.Is(err, narrativeledger.ErrRevisionConflict): status, code, message = http.StatusConflict, "revision_conflict", err.Error(); case errors.Is(err, narrativeledger.ErrSemanticConflict): status, code, message = http.StatusConflict, "narrative_conflict", err.Error(); case errors.Is(err, narrativeledger.ErrIntegrity): status, code, message = http.StatusConflict, "narrative_integrity_failure", "Narrative Ledger integrity verification failed" }
          	if override != 0 && status >= 500 { status = override }
          	writeNarrativeError(w, r, status, code, message)
          }

          func writeNarrativeError(w http.ResponseWriter, r *http.Request, status int, code, message string) { writeNarrativeJSON(w, r, status, map[string]any{"error": map[string]any{"code": code, "message": message, "trace_id": narrativeTraceID(r)}}) }
          func writeNarrativeJSON(w http.ResponseWriter, r *http.Request, status int, value any) { w.Header().Set("Content-Type", "application/json"); w.Header().Set("X-Trace-ID", narrativeTraceID(r)); w.WriteHeader(status); _ = json.NewEncoder(w).Encode(value) }
          func narrativeTraceID(r *http.Request) string { if trace := strings.TrimSpace(r.Header.Get("X-Trace-ID")); trace != "" { return trace }; trace := fmt.Sprintf("narrative-%d", time.Now().UnixNano()); r.Header.Set("X-Trace-ID", trace); return trace }

          var _ = context.Canceled
          EOF

