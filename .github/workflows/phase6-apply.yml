          export type NarrativeEventKind =
            | 'chapter.finalized' | 'scene.recorded' | 'beat.recorded'
            | 'thread.opened' | 'thread.advanced' | 'thread.resolved' | 'thread.abandoned'
            | 'promise.made' | 'promise.paid' | 'promise.broken'
            | 'question.opened' | 'question.answered'
            | 'character_arc.advanced' | 'relationship_arc.advanced'
            | 'tension.set' | 'note.recorded';

          export interface NarrativeSourceRef { type: string; id: string }
          export interface NarrativeEventInput { event_id?: string; kind: NarrativeEventKind; chapter?: number; sequence?: number; subject?: string; thread_id?: string; payload?: Record<string, unknown>; tags?: string[]; source: NarrativeSourceRef }
          export interface NarrativeEvent extends NarrativeEventInput { project_id: string; revision: number; previous_hash?: string; hash: string; request_hash: string; idempotency_key: string; created_at: string }
          export interface NarrativeReceipt { project_id: string; idempotency_key: string; request_hash: string; from_revision: number; to_revision: number; head_hash: string; event_ids: string[] }
          export interface NarrativeThread { id: string; title?: string; status: string; opened_chapter: number; updated_chapter: number; resolution?: string }
          export interface NarrativePromise { id: string; description?: string; status: string; made_chapter: number; updated_chapter: number; outcome?: string }
          export interface NarrativeQuestion { id: string; question?: string; status: string; opened_chapter: number; updated_chapter: number; answer?: string }
          export interface NarrativeArc { id: string; kind: string; status?: string; summary?: string; step: number; updated_chapter: number }
          export interface NarrativeState { project_id: string; revision: number; head_hash?: string; last_finalized_chapter: number; tension: number; threads: Record<string, NarrativeThread>; promises: Record<string, NarrativePromise>; questions: Record<string, NarrativeQuestion>; character_arcs: Record<string, NarrativeArc>; relationship_arcs: Record<string, NarrativeArc>; scenes: Array<{event_id:string;chapter:number;sequence:number;title?:string;summary?:string}>; beats: Array<{event_id:string;chapter:number;sequence:number;summary?:string}> }
          export interface NarrativeAudit { project_id: string; valid: boolean; revision: number; head_hash?: string; checked_events: number; errors?: string[] }

          export class NarrativeLedgerAPIError extends Error {
            constructor(public status: number, public code: string, message: string, public traceID?: string) { super(message); this.name = 'NarrativeLedgerAPIError'; }
          }

          type FetchLike = typeof fetch;
          const encode = encodeURIComponent;

          async function requestJSON<T>(path: string, init: RequestInit = {}, fetcher: FetchLike = fetch): Promise<T> {
            const response = await fetcher(path, init);
            const payload = await response.json().catch(() => ({})) as Record<string, any>;
            if (!response.ok) {
              const error = payload.error ?? {};
              throw new NarrativeLedgerAPIError(response.status, String(error.code ?? 'request_failed'), String(error.message ?? `Request failed (${response.status})`), error.trace_id ? String(error.trace_id) : response.headers.get('X-Trace-ID') ?? undefined);
            }
            return payload as T;
          }

          export function narrativeIdempotencyKey(prefix = 'narrative'): string {
            const random = globalThis.crypto?.randomUUID?.() ?? `${Date.now()}-${Math.random().toString(16).slice(2)}`;
            return `${prefix}-${random}`;
          }

          export function projectIDFromLocation(location: Pick<Location, 'pathname'|'search'> = window.location): string {
            const query = new URLSearchParams(location.search).get('project'); if (query) return query;
            const segments = location.pathname.split('/').filter(Boolean);
            const index = segments.findIndex((value) => value === 'projects');
            return index >= 0 && segments[index + 1] ? decodeURIComponent(segments[index + 1]) : '';
          }

          export async function commitNarrativeEvents(projectID: string, events: NarrativeEventInput[], expectedRevision?: number, idempotencyKey = narrativeIdempotencyKey(), fetcher: FetchLike = fetch): Promise<NarrativeReceipt> {
            return requestJSON(`/api/projects/${encode(projectID)}/narrative/events`, {method:'POST',headers:{'Content-Type':'application/json','Idempotency-Key':idempotencyKey},body:JSON.stringify({expected_revision: expectedRevision, events})}, fetcher);
          }

          export async function getNarrativeState(projectID: string, options: {revision?:number;chapter?:number} = {}, fetcher: FetchLike = fetch): Promise<NarrativeState> {
            const query = new URLSearchParams(); if (options.revision) query.set('revision', String(options.revision)); if (options.chapter) query.set('chapter', String(options.chapter));
            return requestJSON(`/api/projects/${encode(projectID)}/narrative/state${query.size ? `?${query}` : ''}`, {}, fetcher);
          }

          export async function listNarrativeEvents(projectID: string, options: {afterRevision?:number;beforeRevision?:number;chapter?:number;kinds?:NarrativeEventKind[];limit?:number} = {}, fetcher: FetchLike = fetch): Promise<NarrativeEvent[]> {
            const query = new URLSearchParams(); if (options.afterRevision) query.set('after_revision', String(options.afterRevision)); if (options.beforeRevision) query.set('before_revision', String(options.beforeRevision)); if (options.chapter) query.set('chapter', String(options.chapter)); for (const kind of options.kinds ?? []) query.append('kind', kind); query.set('limit', String(Math.min(500, Math.max(1, options.limit ?? 100))));
            const result = await requestJSON<{events:NarrativeEvent[]}>(`/api/projects/${encode(projectID)}/narrative/events?${query}`, {}, fetcher); return result.events;
          }

          export function auditNarrativeLedger(projectID: string, fetcher: FetchLike = fetch): Promise<NarrativeAudit> { return requestJSON(`/api/projects/${encode(projectID)}/narrative/audit`, {}, fetcher); }
          EOF

