          cat > docs/NARRATIVE_LEDGER.md <<'EOF'
          # Narrative Ledger

          Phase 6 adds an append-only narrative memory that records how the story develops without replacing the Structured Truth Store.

          ## Authority boundary

          - Truth Store is authoritative for world, character, inventory, knowledge, timeline and other factual state.
          - Narrative Ledger is authoritative for recorded narrative structure: scenes, beats, open threads, promises, questions, character arcs, relationship arcs and tension.
          - Full chapter text is not copied into the ledger. Events carry bounded structured summaries and provenance.
          - Retrieval or RAG output is never treated as authority by either store.

          ## Integrity model

          Each project has an ordered revision stream. Every event contains its previous hash and a SHA-256 hash over its canonical content, revision, provenance, request hash, idempotency key and timestamp. A batch is validated and projected before one crash-safe replacement; semantic failure leaves no partial events. Idempotency replays return the original receipt, while key reuse with different content fails.

          `GET /api/projects/{id}/narrative/audit` recomputes the complete chain and deterministic projection. A failed audit returns HTTP 409 and must not be silently repaired.

          ## Event lifecycle

          Thread, promise and question lifecycle transitions are deterministic. Resolving an unknown thread, paying an unknown promise or answering an unknown question is rejected. Chapter finalization is monotonic. Character and relationship arc events advance one step at a time. Tension is bounded from 0 through 10.

          ## Quality Gate integration

          A successful Phase 5 Finalize response is buffered until the corresponding `chapter.finalized` ledger event is durable. If ledger persistence fails, the final chapter remains durable and the client receives a retryable error. Repeating the same Finalize request safely replays both the quality transaction and ledger idempotency key.

          ## Storage

          The default file repository lives under the operating system user configuration directory at `NovelForge/narrative-ledger`. `NOVELFORGE_NARRATIVE_LEDGER_DIR` overrides the root. Files are project-keyed by SHA-256, mode 0600, and replaced using a same-directory temporary file and backup sequence that also works on Windows. The package publishes `SQLMigration` for deployments that use a relational adapter.

          ## API

          ```text
          POST /api/projects/{id}/narrative/events
          GET  /api/projects/{id}/narrative/state
          GET  /api/projects/{id}/narrative/events
          GET  /api/projects/{id}/narrative/audit
          ```

          Writes require `Idempotency-Key`. `expected_revision` provides optimistic concurrency. State can be projected at a historical `revision` or `chapter`; event queries have bounded filters and a maximum limit of 500.
          EOF

