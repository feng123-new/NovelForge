          from pathlib import Path
          import json, re

          module = next(line.split()[1] for line in Path('go.mod').read_text().splitlines() if line.startswith('module '))
          server_files = list(Path('internal/server').glob('*.go'))
          route_file = next((p for p in server_files if 'chapters/{chapter}/finalize' in p.read_text()), None)
          if route_file is None:
              raise SystemExit('Phase 5 finalize route was not found')
          combined = '\n'.join(p.read_text() for p in server_files)
          type_match = re.search(r'type\s+([A-Za-z_][A-Za-z0-9_]*)\s+struct\s*\{', combined)
          if not type_match:
              raise SystemExit('server type was not found')
          server_type = type_match.group(1)
          for path in [Path('internal/server/narrative_ledger.go'), Path('internal/server/narrative_ledger_test.go')]:
              text = path.read_text().replace('__MODULE__', module).replace('__SERVER_TYPE__', server_type)
              path.write_text(text)

          text = route_file.read_text()
          if '/narrative/events' not in text:
              lines = text.splitlines()
              result = []
              inserted = False
              for line in lines:
                  if 'chapters/{chapter}/finalize' in line and '.HandleFunc(' in line:
                      match = re.search(r',\s*([A-Za-z_][A-Za-z0-9_]*)\.([A-Za-z_][A-Za-z0-9_]*)\s*\)\s*$', line)
                      if not match:
                          raise SystemExit('cannot parse finalize route handler')
                      receiver, method = match.groups()
                      line = line[:match.start()] + f', {receiver}.wrapNarrativeFinalize({receiver}.{method}))'
                      result.append(line)
                      indent = line[:len(line)-len(line.lstrip())]
                      mux = line.strip().split('.HandleFunc(',1)[0]
                      result.extend([
                          f'{indent}{mux}.HandleFunc("POST /api/projects/{{id}}/narrative/events", {receiver}.handleNarrativeCommit)',
                          f'{indent}{mux}.HandleFunc("GET /api/projects/{{id}}/narrative/state", {receiver}.handleNarrativeState)',
                          f'{indent}{mux}.HandleFunc("GET /api/projects/{{id}}/narrative/events", {receiver}.handleNarrativeEvents)',
                          f'{indent}{mux}.HandleFunc("GET /api/projects/{{id}}/narrative/audit", {receiver}.handleNarrativeAudit)',
                      ])
                      inserted = True
                  else:
                      result.append(line)
              if not inserted:
                  raise SystemExit('finalize HandleFunc route was not found')
              route_file.write_text('\n'.join(result)+'\n')

          openapi_path = Path('internal/server/openapi_phase5.json')
          spec = json.loads(openapi_path.read_text())
          paths = spec.setdefault('paths', {})
          components = spec.setdefault('components', {}).setdefault('schemas', {})
          error_ref = {'$ref':'#/components/schemas/NarrativeErrorEnvelope'}
          event_ref = {'$ref':'#/components/schemas/NarrativeEvent'}
          paths['/api/projects/{id}/narrative/events'] = {
            'post': {'operationId':'commitNarrativeEvents','summary':'Append an atomic Narrative Ledger event batch','parameters':[{'name':'id','in':'path','required':True,'schema':{'type':'string'}},{'name':'Idempotency-Key','in':'header','required':True,'schema':{'type':'string','maxLength':200}}],'requestBody':{'required':True,'content':{'application/json':{'schema':{'$ref':'#/components/schemas/NarrativeCommitRequest'}}}},'responses':{'200':{'description':'Idempotent commit receipt','content':{'application/json':{'schema':{'$ref':'#/components/schemas/NarrativeReceipt'}}}},'400':{'description':'Invalid request','content':{'application/json':{'schema':error_ref}}},'409':{'description':'Revision or semantic conflict','content':{'application/json':{'schema':error_ref}}}}},
            'get': {'operationId':'listNarrativeEvents','summary':'List immutable Narrative Ledger events','parameters':[{'name':'id','in':'path','required':True,'schema':{'type':'string'}},{'name':'after_revision','in':'query','schema':{'type':'integer','minimum':0}},{'name':'before_revision','in':'query','schema':{'type':'integer','minimum':0}},{'name':'chapter','in':'query','schema':{'type':'integer','minimum':0}},{'name':'kind','in':'query','schema':{'type':'array','items':{'$ref':'#/components/schemas/NarrativeEventKind'}}},{'name':'limit','in':'query','schema':{'type':'integer','minimum':1,'maximum':500,'default':100}}],'responses':{'200':{'description':'Event list','content':{'application/json':{'schema':{'type':'object','required':['events'],'properties':{'events':{'type':'array','items':event_ref}}}}}},'400':{'description':'Invalid query','content':{'application/json':{'schema':error_ref}}}}}
          }
          paths['/api/projects/{id}/narrative/state'] = {'get':{'operationId':'getNarrativeState','summary':'Project deterministic narrative state','parameters':[{'name':'id','in':'path','required':True,'schema':{'type':'string'}},{'name':'revision','in':'query','schema':{'type':'integer','minimum':0}},{'name':'chapter','in':'query','schema':{'type':'integer','minimum':0}}],'responses':{'200':{'description':'Projected state','content':{'application/json':{'schema':{'$ref':'#/components/schemas/NarrativeState'}}}},'400':{'description':'Invalid query','content':{'application/json':{'schema':error_ref}}}}}}
          paths['/api/projects/{id}/narrative/audit'] = {'get':{'operationId':'auditNarrativeLedger','summary':'Verify Narrative Ledger hash chain and projection','parameters':[{'name':'id','in':'path','required':True,'schema':{'type':'string'}}],'responses':{'200':{'description':'Valid ledger','content':{'application/json':{'schema':{'$ref':'#/components/schemas/NarrativeAudit'}}}},'409':{'description':'Integrity failure','content':{'application/json':{'schema':{'$ref':'#/components/schemas/NarrativeAudit'}}}}}}}
          kinds = ['chapter.finalized','scene.recorded','beat.recorded','thread.opened','thread.advanced','thread.resolved','thread.abandoned','promise.made','promise.paid','promise.broken','question.opened','question.answered','character_arc.advanced','relationship_arc.advanced','tension.set','note.recorded']
          components.update({
            'NarrativeEventKind': {'type':'string','enum':kinds},
            'NarrativeSourceRef': {'type':'object','additionalProperties':False,'required':['type','id'],'properties':{'type':{'type':'string','maxLength':64},'id':{'type':'string','maxLength':256}}},
            'NarrativeEventInput': {'type':'object','additionalProperties':False,'required':['kind','source'],'properties':{'event_id':{'type':'string','maxLength':128},'kind':{'$ref':'#/components/schemas/NarrativeEventKind'},'chapter':{'type':'integer','minimum':0},'sequence':{'type':'integer','minimum':0},'subject':{'type':'string','maxLength':128},'thread_id':{'type':'string','maxLength':128},'payload':{'type':'object','additionalProperties':True},'tags':{'type':'array','maxItems':32,'items':{'type':'string','maxLength':64}},'source':{'$ref':'#/components/schemas/NarrativeSourceRef'}}},
            'NarrativeCommitRequest': {'type':'object','additionalProperties':False,'required':['events'],'properties':{'expected_revision':{'type':'integer','minimum':0},'events':{'type':'array','minItems':1,'maxItems':128,'items':{'$ref':'#/components/schemas/NarrativeEventInput'}}}},
            'NarrativeEvent': {'allOf':[{'$ref':'#/components/schemas/NarrativeEventInput'},{'type':'object','required':['project_id','revision','hash','request_hash','idempotency_key','created_at'],'properties':{'project_id':{'type':'string'},'revision':{'type':'integer'},'previous_hash':{'type':'string'},'hash':{'type':'string'},'request_hash':{'type':'string'},'idempotency_key':{'type':'string'},'created_at':{'type':'string','format':'date-time'}}}]},
            'NarrativeReceipt': {'type':'object','required':['project_id','idempotency_key','request_hash','from_revision','to_revision','head_hash','event_ids'],'properties':{'project_id':{'type':'string'},'idempotency_key':{'type':'string'},'request_hash':{'type':'string'},'from_revision':{'type':'integer'},'to_revision':{'type':'integer'},'head_hash':{'type':'string'},'event_ids':{'type':'array','items':{'type':'string'}}}},
            'NarrativeThreadState': {'type':'object','additionalProperties':True},
            'NarrativePromiseState': {'type':'object','additionalProperties':True},
            'NarrativeQuestionState': {'type':'object','additionalProperties':True},
            'NarrativeArcState': {'type':'object','additionalProperties':True},
            'NarrativeState': {'type':'object','required':['project_id','revision','last_finalized_chapter','tension','threads','promises','questions','character_arcs','relationship_arcs','scenes','beats'],'properties':{'project_id':{'type':'string'},'revision':{'type':'integer'},'head_hash':{'type':'string'},'last_finalized_chapter':{'type':'integer'},'tension':{'type':'number','minimum':0,'maximum':10},'threads':{'type':'object','additionalProperties':{'$ref':'#/components/schemas/NarrativeThreadState'}},'promises':{'type':'object','additionalProperties':{'$ref':'#/components/schemas/NarrativePromiseState'}},'questions':{'type':'object','additionalProperties':{'$ref':'#/components/schemas/NarrativeQuestionState'}},'character_arcs':{'type':'object','additionalProperties':{'$ref':'#/components/schemas/NarrativeArcState'}},'relationship_arcs':{'type':'object','additionalProperties':{'$ref':'#/components/schemas/NarrativeArcState'}},'scenes':{'type':'array','items':{'type':'object','additionalProperties':True}},'beats':{'type':'array','items':{'type':'object','additionalProperties':True}}}},
            'NarrativeAudit': {'type':'object','required':['project_id','valid','revision','checked_events'],'properties':{'project_id':{'type':'string'},'valid':{'type':'boolean'},'revision':{'type':'integer'},'head_hash':{'type':'string'},'checked_events':{'type':'integer'},'errors':{'type':'array','items':{'type':'string'}}}},
            'NarrativeErrorEnvelope': {'type':'object','required':['error'],'properties':{'error':{'type':'object','required':['code','message','trace_id'],'properties':{'code':{'type':'string'},'message':{'type':'string'},'trace_id':{'type':'string'}}}}}
          })
          openapi_path.write_text(json.dumps(spec, ensure_ascii=False, indent=2)+'\n')

          chapters = Path('web/src/pages/Chapters.svelte')
          text = chapters.read_text()
          if 'NarrativeLedgerPanel' not in text:
              script = re.search(r'<script[^>]*>', text)
              if not script: raise SystemExit('Chapters script block not found')
              insertion = "\n  import NarrativeLedgerPanel from '../components/NarrativeLedgerPanel.svelte';"
              text = text[:script.end()] + insertion + text[script.end():]
              style = text.find('<style')
              if style < 0: raise SystemExit('Chapters style block not found')
              text = text[:style] + '\n<NarrativeLedgerPanel />\n\n' + text[style:]
              chapters.write_text(text)

          ci = Path('.github/workflows/ci.yml')
          ci_text = ci.read_text()
          if 'internal/narrativeledger' not in ci_text:
              lines=[]; changed=False
              for line in ci_text.splitlines():
                  if 'go test' in line and '-race' in line and 'internal/qualitygate' in line:
                      line += ' ./internal/narrativeledger'; changed=True
                  lines.append(line)
              if changed: ci.write_text('\n'.join(lines)+'\n')

          additions = {
            'docs/API.md': '\n\n## Narrative Ledger (Phase 6)\n\nNarrative structure is available through `POST /api/projects/{id}/narrative/events` and the state, event-list and audit GET routes. Writes require `Idempotency-Key`; `expected_revision` provides optimistic concurrency. Responses include trace IDs and safe structured errors. See `NARRATIVE_LEDGER.md`.\n',
            'docs/ENGINE.md': '\n\n## Narrative Ledger boundary\n\nAfter a chapter passes the Phase 5 quality transaction, Finalize records a replay-safe `chapter.finalized` event in the append-only Narrative Ledger. The ledger projects narrative threads, promises, questions, scenes, beats, arcs and tension; it never supersedes Truth Store facts and never stores full chapter prose.\n',
            'docs/ARCHITECTURE.md': '\n\n## Phase 6 — Narrative Ledger\n\nThe Narrative Ledger is a separate append-only aggregate with optimistic revisions, request idempotency, semantic transition validation, a cryptographic hash chain, historical projection and full audit. The Phase 5 Finalize boundary is a recoverable two-step saga: the final chapter stays durable if ledger persistence must be retried.\n',
            'docs/AGENTS.md': '\n\n## Narrative Ledger access\n\nAgents propose bounded narrative events with provenance. They cannot mutate prior events, bypass lifecycle checks or convert narrative notes into Truth. Only the deterministic repository appends a validated batch, and only the Finalize coordinator records `chapter.finalized`.\n'
          }
          for name, addition in additions.items():
              path=Path(name); current=path.read_text()
              marker=addition.splitlines()[2]
              if marker not in current: path.write_text(current.rstrip()+addition)

          status = Path('docs/IMPLEMENTATION_STATUS.md')
          current = status.read_text()
          old = '| 6–13 | not started | Phase 6 begins from the latest accepted main; no Phase 6 production work is included in Phase 5. |'
          new = '| 6 — Narrative Ledger | implementation complete; acceptance pending | Append-only hash-chained narrative events, deterministic projections, REST/OpenAPI/Web integration and Finalize saga are on the Phase 6 PR. |\n| 7–13 | not started | Phase 7 begins only after Phase 6 merged-main acceptance. |'
          if old in current: current=current.replace(old,new,1)
          if '## Phase 6\n' not in current:
              current += '''\n\n## Phase 6\n\n### Completed\n\n- Added an append-only, project-scoped Narrative Ledger with deterministic revisions and SHA-256 event chaining.\n- Added atomic batch validation, optimistic revision control, idempotent replay and content-conflict rejection.\n- Added deterministic lifecycle projection for scenes, beats, threads, promises, questions, character arcs, relationship arcs and tension.\n- Added historical revision/chapter projection and full-chain integrity audit.\n- Added crash-safe Windows-compatible file persistence and a documented relational schema.\n- Added a recoverable Quality Gate Finalize → Narrative Ledger boundary.\n- Added real REST routes, OpenAPI schemas, a typed Web client and a Chapters workspace ledger panel.\n- Added backend concurrency, atomicity, replay, tamper, HTTP and frontend client tests.\n\n### Acceptance State\n\nImplementation is complete on `feature/phase-06-narrative-ledger`; exact-head PR CI, squash merge and merge-triggered main CI are pending.\n\n### Next Phase\n\n`feature/phase-07-context-compiler` after Phase 6 merged-main acceptance.\n'''
          status.write_text(current)
          PY

          gofmt -w internal/narrativeledger/*.go internal/server/narrative_ledger*.go
          python3 -m json.tool internal/server/openapi_phase5.json >/dev/null

      - name: Validate backend
        shell: bash
        run: |
          set -euo pipefail
          GOWORK=off go vet ./...
          GOWORK=off go test -buildvcs=false -count=1 ./...
          CGO_ENABLED=0 GOWORK=off go build -buildvcs=false ./...

      - name: Validate frontend
        shell: bash
        working-directory: web
        run: |
          set -euo pipefail
          npm ci
          npm run check
          npm test -- --run
          npm run build

      - name: Commit validated feature branch
        shell: bash
        run: |
          set -euo pipefail
          git add .
          if git diff --cached --quiet; then
            echo 'No Phase 6 changes were produced' >&2
            exit 1
          fi
          git commit -m 'feat: add append-only narrative ledger'
          git push --force origin HEAD:feature/phase-06-narrative-ledger
          git push origin --delete ops/phase6-apply || true
