name: Temporary Phase 6 final acceptance and cleanup

on:
  push:
    branches:
      - ops/phase6-final-acceptance-monitor

permissions:
  actions: read
  contents: write
  pull-requests: read

jobs:
  accept:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Verify final main, clean Phase 6 refs and publish audit marker
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${REPOSITORY}"
          header=(-H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28')

          production_pr="$(curl -fsSL "${header[@]}" "${api}/pulls/22")"
          evidence_pr="$(curl -fsSL "${header[@]}" "${api}/pulls/23")"
          test "$(jq -r '.merged' <<<"${production_pr}")" = true
          test "$(jq -r '.merged' <<<"${evidence_pr}")" = true

          feature_head="$(jq -r '.head.sha' <<<"${production_pr}")"
          production_merge="$(jq -r '.merge_commit_sha' <<<"${production_pr}")"
          evidence_head="$(jq -r '.head.sha' <<<"${evidence_pr}")"
          evidence_merge="$(jq -r '.merge_commit_sha' <<<"${evidence_pr}")"

          latest_successful_pr_run() {
            local head_sha="$1" pr_number="$2"
            curl -fsSL "${header[@]}" "${api}/actions/runs?event=pull_request&head_sha=${head_sha}&per_page=30" \
              | jq -r --arg sha "${head_sha}" --argjson pr "${pr_number}" \
                '[.workflow_runs[] | select(.name == "CI" and .head_sha == $sha and .status == "completed" and .conclusion == "success" and any(.pull_requests[]?; .number == $pr))] | sort_by(.created_at) | last.id // empty'
          }
          production_pr_run="$(latest_successful_pr_run "${feature_head}" 22)"
          evidence_pr_run="$(latest_successful_pr_run "${evidence_head}" 23)"
          test -n "${production_pr_run}"
          test -n "${evidence_pr_run}"

          production_main_run="$(curl -fsSL "${header[@]}" "${api}/actions/runs?event=push&head_sha=${production_merge}&branch=main&per_page=20" \
            | jq -r --arg sha "${production_merge}" '[.workflow_runs[] | select(.name == "CI" and .head_sha == $sha and .status == "completed" and .conclusion == "success")] | sort_by(.created_at) | last.id // empty')"
          test -n "${production_main_run}"

          final_main_run=''
          final_run=''
          for _ in $(seq 1 170); do
            runs="$(curl -fsSL "${header[@]}" "${api}/actions/runs?event=push&head_sha=${evidence_merge}&branch=main&per_page=20")"
            final_run="$(jq -c --arg sha "${evidence_merge}" '[.workflow_runs[] | select(.name == "CI" and .head_sha == $sha)] | sort_by(.created_at) | last // empty' <<<"${runs}")"
            if [[ -n "${final_run}" ]]; then
              final_main_run="$(jq -r '.id' <<<"${final_run}")"
              if [[ "$(jq -r '.status' <<<"${final_run}")" = completed ]]; then
                test "$(jq -r '.conclusion' <<<"${final_run}")" = success
                break
              fi
            fi
            sleep 8
          done
          test -n "${final_main_run}"
          test "$(jq -r '.status' <<<"${final_run}")" = completed
          test "$(jq -r '.conclusion' <<<"${final_run}")" = success

          jobs="$(curl -fsSL "${header[@]}" "${api}/actions/runs/${final_main_run}/jobs?per_page=100")"
          jq -e '
            def succeeded($name): any(.jobs[]; .name == $name and .status == "completed" and .conclusion == "success");
            succeeded("Go lint, test and build") and
            succeeded("Frontend check, test and build") and
            succeeded("Windows test and build") and
            succeeded("Docker build")
          ' <<<"${jobs}" >/dev/null

          branch_main="$(curl -fsSL "${header[@]}" "${api}/branches/main" | jq -r '.commit.sha')"
          test "${branch_main}" = "${evidence_merge}"
          test "$(curl -fsSL "${header[@]}" "${api}/pulls?state=open&per_page=100" | jq 'length')" = 0

          git init work
          cd work
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${REPOSITORY}.git"
          git fetch --depth=1 origin "${evidence_merge}"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "${evidence_merge}"
          test "$(find .github/workflows -maxdepth 1 -type f -printf '%f\n' | sort | tr '\n' ' ')" = 'ci.yml '
          grep -Fq '| 6 — Narrative Ledger | complete |' docs/IMPLEMENTATION_STATUS.md
          grep -Fq 'feature/phase-07-context-compiler' docs/IMPLEMENTATION_STATUS.md
          grep -Fq "${feature_head}" docs/IMPLEMENTATION_STATUS.md
          grep -Fq "${production_pr_run}" docs/IMPLEMENTATION_STATUS.md
          grep -Fq "${production_merge}" docs/IMPLEMENTATION_STATUS.md
          grep -Fq "${production_main_run}" docs/IMPLEMENTATION_STATUS.md

          cd ..
          refs="$(curl -fsSL "${header[@]}" "${api}/git/matching-refs/heads/")"
          : > deleted-phase6-refs.txt
          while IFS= read -r branch; do
            [[ -n "${branch}" ]] || continue
            case "${branch}" in
              feature/phase-06-narrative-ledger|docs/phase-06-acceptance|ops/phase6-*|ops/phase-06-*)
                encoded="$(python3 -c 'import sys, urllib.parse; print(urllib.parse.quote(sys.argv[1], safe=""))' "${branch}")"
                curl -fsSL -X DELETE "${header[@]}" "${api}/git/refs/heads/${encoded}"
                printf '%s\n' "${branch}" >> deleted-phase6-refs.txt
                ;;
            esac
          done < <(jq -r '.[].ref | sub("^refs/heads/"; "")' <<<"${refs}")

          sleep 3
          remaining="$(curl -fsSL "${header[@]}" "${api}/git/matching-refs/heads/" \
            | jq -r '.[].ref | sub("^refs/heads/"; "") | select(. == "feature/phase-06-narrative-ledger" or . == "docs/phase-06-acceptance" or startswith("ops/phase6-") or startswith("ops/phase-06-"))')"
          test -z "${remaining}"
          test "$(curl -fsSL "${header[@]}" "${api}/pulls?state=open&per_page=100" | jq 'length')" = 0

          cd work
          git checkout --detach "${evidence_merge}"
          git checkout -B audit/phase-06-completion-20260902
          mkdir -p .phase6
          deleted_json="$(jq -R -s 'split("\n") | map(select(length > 0))' ../deleted-phase6-refs.txt)"
          jq -n \
            --arg feature_head "${feature_head}" \
            --arg production_pr_run "${production_pr_run}" \
            --arg production_merge "${production_merge}" \
            --arg production_main_run "${production_main_run}" \
            --arg evidence_head "${evidence_head}" \
            --arg evidence_pr_run "${evidence_pr_run}" \
            --arg evidence_merge "${evidence_merge}" \
            --arg final_main_run "${final_main_run}" \
            --arg accepted_at "$(date -u +%FT%TZ)" \
            --argjson deleted_refs "${deleted_json}" \
            '{phase:6, status:"complete", production:{pr:22, final_head:$feature_head, pr_ci_run:$production_pr_run, merge_sha:$production_merge, main_ci_run:$production_main_run}, acceptance_record:{pr:23, head_sha:$evidence_head, pr_ci_run:$evidence_pr_run, merge_sha:$evidence_merge, final_main_ci_run:$final_main_run}, required_jobs_success:true, open_prs:0, main_workflows:["ci.yml"], phase6_refs_deleted:$deleted_refs, next_branch:"feature/phase-07-context-compiler", accepted_at:$accepted_at}' \
            > .phase6/final-acceptance.json
          git add .phase6/final-acceptance.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'audit: record Phase 6 final acceptance'
          git push --force origin HEAD:refs/heads/audit/phase-06-completion-20260902
