name: Phase 12 and 13A post-release cleanup
on:
  push:
    branches: [ops/phase13a-20260906]
permissions:
  contents: write
concurrency:
  group: phase13a-delivery
  cancel-in-progress: false
jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify published candidate, archive exact refs, and prune only this delivery
        env:
          GH_TOKEN: ${{ github.token }}
        run: python .delivery13/cleanup.py
