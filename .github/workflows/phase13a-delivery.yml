name: Remove verified unpublished candidate draft
on:
  push:
    branches: [ops/phase13a-20260906]
permissions:
  contents: write
concurrency:
  group: phase13a-delivery
  cancel-in-progress: false
jobs:
  cleanup-draft:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check draft identity and failed-run evidence before removal
        env:
          GH_TOKEN: ${{ github.token }}
        run: python .delivery13/remove_unpublished.py
