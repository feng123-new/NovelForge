name: Phase 4 local bootstrap

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  package-go-environment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Prepare exact vendored graph
        env:
          GOWORK: "off"
        run: |
          go mod download all
          go mod vendor
      - name: Package toolchain and vendor tree
        run: |
          mkdir -p /tmp/phase4-go
          tar -C "$(dirname "$(go env GOROOT)")" -czf /tmp/phase4-go/toolchain.tgz "$(basename "$(go env GOROOT)")"
          tar -czf /tmp/phase4-go/vendor.tgz vendor
      - uses: actions/upload-artifact@v4
        with:
          name: phase-04-go-environment-${{ github.run_id }}
          if-no-files-found: error
          path: /tmp/phase4-go
