name: Bilingual workspace checks
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: bilingual-${{ github.ref }}
  cancel-in-progress: true
jobs:
  bilingual:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: npm ci --prefix web
      - name: Dictionary, static text and affected interaction gates
        run: |
          npm run check:i18n --prefix web
          npm run check --prefix web -- --fail-on-warnings
          npm run test:i18n --prefix web
          npm test --prefix web -- src/pages src/lib/wizard.test.ts
      - name: Reproducible embedded production build
        run: |
          npm run build --prefix web
          git diff --exit-code -- web/dist web/package-lock.json
          CGO_ENABLED=0 go build -o /tmp/novelforge ./cmd/novelforge
      - name: Real bilingual browser with an isolated project and no paid provider
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk >/dev/null
          node scripts/i18n-browser.mjs /tmp/novelforge
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bilingual-browser-${{ github.sha }}
          path: verification-results/i18n
          if-no-files-found: warn
