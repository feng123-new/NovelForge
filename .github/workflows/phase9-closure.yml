name: Phase 9 closure post-merge cleanup
on:
  push:
    branches: [ops/phase9-closure]
permissions:
  contents: write
concurrency:
  group: phase9-bounded-closure
  cancel-in-progress: false
jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify exact merge, archive and remove only two maintenance refs
        env:
          GH_TOKEN: ${{ github.token }}
        run: python .phase9close/cleanup.py
