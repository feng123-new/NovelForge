          append_once("docs/ARCHITECTURE.md", "## 18. Phase 6 Narrative Ledger", r'''
          ## 18. Phase 6 Narrative Ledger

          Phase 6 introduces `internal/narrativeledger` as an indexed, project-local projection for Foreshadows and Secrets. It does not create a competing truth authority: accepted chapter Finals remain the only model-originated write boundary, and all Ledger changes retain Truth-compatible authority and provenance.

          The Chapter Commit Coordinator applies accepted Truth events and Narrative Ledger changes as replay-safe saga steps keyed by the same chapter transaction. Rejected candidates, Continuity failures, HOLD states, and unaccepted Librarian proposals cannot mutate the Ledger. Re-entry after a crash returns the prior Ledger commit rather than duplicating Foreshadow, Secret, holder, or reveal events.

          Foreshadow `OVERDUE` is a Chapter-N calculation, never a stored lifecycle state. Secret truth is separated from role knowledge through temporal holder ranges and public-reveal boundaries. The Planner adapter returns all overdue and critical Foreshadows as mandatory items, known Secret summaries only for an authorized POV, and explicit truth-free unknown boundaries for everything else. Phase 7 consumes this stable provider under token budgets without weakening those rules.
          ''')

          append_once("docs/TRUTH_STORE.md", "## Narrative Ledger integration", r'''
          ## Narrative Ledger integration

          Narrative Ledger migration 4 shares the project database and the existing migration, backup, checksum, WAL, busy-timeout, and rollback guarantees. Ledger rows are optimized projections and audit history for Foreshadows and Secrets; the Structured Truth Store remains the authority for general world facts.

          Model-originated Ledger writes are accepted only after the Phase 5 coordinator selects and finalizes a continuity-safe candidate. Each accepted change carries source chapter, source version, authority, confidence, and provenance compatible with Truth events. A replayed Finalize operation returns the existing Ledger commit, while a changed payload under the same transaction/idempotency identity fails closed.

          Chapter-N Secret visibility is determined independently from authority truth. Holder ranges and public reveal chapters prevent later knowledge from leaking into earlier Planner or Writer context. Rebuild and future Human Edit synchronization must preserve this boundary together with Truth projections.
          ''')

          append_once("docs/WEB.md", "## Phase 6 Narrative Ledger pages", r'''
          ## Phase 6 Narrative Ledger pages

          Phase 6 adds real **Foreshadows** and **Secrets** routes to the embedded workspace. Both pages load projects and Chapter-N state through the typed API client, use server-generated authority as the source of truth, disable writes while pending, display structured error codes and trace IDs, and reload after each successful mutation.

          The Foreshadows page exposes computed OVERDUE metrics, stable filtered lists, creation, progress, resolve, and abandon operations. The Secrets page deliberately separates the management-only authority truth from Chapter-N holder ranges and public status; it supports private creation, temporal holder addition, and explicit public reveal.

          Component tests cover empty and structured-error states, idempotent writes, pending-state button protection, lifecycle transitions, temporal holder writes, public reveal, and authoritative refresh. `web/dist` is rebuilt from the committed lockfile and remains a CI-checked `go:embed` release input.
          ''')

