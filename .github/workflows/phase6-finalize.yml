name: Phase 6 delivery finalization

on:
  push:
    branches: [feature/phase-06-narrative-ledger]

permissions:
  contents: write

concurrency:
  group: phase6-delivery-finalization
  cancel-in-progress: true

jobs:
  finalize:
    if: >-
      github.actor != 'github-actions[bot]' &&
      github.event.head_commit.message == 'chore: run Phase 6 finalizer'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/phase-06-narrative-ledger
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Apply Phase 6 finalization
        run: python3 .github/scripts/phase6_finalize.py
      - name: Install, test and rebuild Web
        working-directory: web
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run check
          npm test
          npm run build
          npm audit --audit-level=high
      - name: Validate Go, OpenAPI, race and scale gates
        env:
          GOWORK: "off"
        run: |
          unformatted="$(gofmt -l .)"
          test -z "$unformatted" || { printf 'gofmt required for:\n%s\n' "$unformatted"; exit 1; }
          go vet ./...
          go test -buildvcs=false -count=1 ./...
          go test -race -buildvcs=false -count=1 ./internal/db/migrate ./internal/project ./internal/qualitygate ./internal/truthstore ./internal/narrativeledger ./internal/server/...
          NOVELFORGE_SCALE_TEST=1 go test -buildvcs=false -count=1 ./internal/truthstore -run '^TestHundredThousandFactTemporalQueryUsesIndex$'
          go test -buildvcs=false -count=1 ./internal/server -run '^TestOpenAPI'
          CGO_ENABLED=0 go build -trimpath ./cmd/novelforge
          git diff --check
      - name: Commit clean Phase 6 delivery
        run: |
          git rm .github/workflows/phase6-finalize.yml .github/scripts/phase6_finalize.py
          git add -A
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "test: complete Phase 6 acceptance gates"
          git push origin HEAD:feature/phase-06-narrative-ledger
