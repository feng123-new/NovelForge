services:
  novelforge:
    image: ghcr.io/feng123-new/novelforge:latest
    build:
      context: .
    command:
      - server
      - --host
      - 0.0.0.0
      - --port
      - "48090"
      - --workspace
      - /workspace
    ports:
      - "127.0.0.1:48090:48090"
    volumes:
      - ./config:/root/.novelforge
      - ./workspace:/workspace
    restart: unless-stopped
